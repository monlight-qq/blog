        fullContent:
        `<p>线性表：是由n(n≥0)个相同类型数据元素组成的有限序列。当n = 0时记为空表。</p>
        <p>在线性逻辑表示中，a<sub>1</sub>为开始元素，a<sub>n</sub>称为终端元素（尾元素）</p>
        <p>对于任意一对相邻元素，<a<sub>i</sub>,a<sub>i + 1</sub>>(1 ≤ i ≤ n),a<sub>i</sub>是a<sub>i + 1</sub>的前驱元素（或结点），a<sub>i + 1</sub>是a<sub>i</sub>的后继元素。</p>
        <p>顺序表（ArrayList），是线性表用数组实现的具体子类，是一种基于数组实现的数据结构，它提供了动态调整大小的功能。顺序表中的元素在内存中是连续存储的，因此可以通过索引快速访问元素。顺序表支持插入、删除和查找等基本操作。</p>
        <p>本篇主要实现一下顺序表的8个基本操作：初始化，销毁，求表的长度，求表的第i个元素，按值查找，插入，删除，输出元素。</p>
        <p>首先是顺序表的定义，还包含了头文件：&ltstdio.h&gt</p>
        <p><pre><code class = 'language-c'>
#define _CRT_SECURE_NO_WARNINGS//防止C语言编译器报错，允许使用scanf等不安全的函数
#define MAX_SIZE 100//顺序表的最大长度为100，可以根据需要调整
#include&ltstdio.h&gt

//顺序表的定义
typedef int ElemType;//假设顺序表中存储的是整数类型的元素，可以根据需要修改为其他类型
typedef struct
{
	ElemType data[MAX_SIZE];//ElemType类型的数组data,用来存放数据，最大是MAX_SIZE
	int length;//长度
}SqList;   
        </code></pre></p>
        <p>上面的代码就是顺序表的定义</p>
        <p>下面是顺序表的8个基本操作的实现：</p>
        <p>1. 初始化顺序表运算算法</p>
        <p>初始化线性表，将顺序表的长度置为0</p>
        <p><pre><code class = 'language-c'>
void InitList(SqList& L)//初始化顺序表L要回传给实参，所以用引用类型
{
	L.length = 0;
}
        </code></pre></p>
        <p>本算法的时间复杂度为O(1)</p>
        <p>2. 销毁顺序表运算算法</p>
        <p><pre><code class = 'language-c'>
void DestroyList(SqList L)
{
//顺序表是静态分配的，不需要时会自动释放内存，所以销毁顺序表的操作可以不做任何处理。
}
        </code></pre></p>
        <p>3. 求表的长度运算算法</p>
        <p>返回的是线性表的长度</p>
        <p><pre><code class = 'language-c'>
int GetLength(SqList L)
{
	return L.length;
}
        </code></pre></p>
        <p>本算法的时间复杂度为O(1)</p>
        <p>4. 求表的第i个元素运算算法</p>
        <p>首先判断i是否合法，这里的i是从1开始，无效返回0，取到元素返回1</p>
        <p><pre><code class = 'language-c'>
int GetElem(SqList L, int i, ElemType& e)
{
	if (i<1 || i>L.length)
	{
		return 0;//无效的i值返回0
	}
	else
	{
		e = L.data[i - 1];//取元素并且返回1
		return 1;
	}
}
        </code></pre></p>
        <p>本算法的时间复杂度为O(1)</p>
        <p>5. 按值查找运算算法</p>
        <p>首先定义一个计数器i（此时的i是下标），从合法范围（0~L.length - 1）内找到第一个值是x的位置。当i >= 表长，返回0，未找到；否则找到，返回i + 1（位置 = 下标i + 1）,原因：i从0开始</p>
        <p><pre><code class = 'language-c'>
int Locate(SqList L, ElemType x)
{
	int i = 0;
	while (i < L.length && L.data[i] != x)
	{
		i++;//查找第一个值为x的元素，范围为0~L.length - 1
    }    

		if (i >= L.length)
		{
			return 0;//未找到返回0
		}
		else
		{
			return (i + 1);//找到返回位置
		}
}
        </code></pre></p>
        <p>本算法的时间复杂度为O(n)</p>
        <p>6. 插入运算算法(后插)</p>
        <p>思路：先判断能否插入，再将第i个位置及以后的元素向后移动一位，然后在第i个位置插入新元素，判断是否插入成功，长度+1</p>
        <p>首先判断顺序表是否满了，以及i是否合法（此时的i是位置，从1开始，到L.length，但由于是插入，i的合法范围变成了2 ~ L.length）</p>
        <p>然后循环变量j从顺序表末尾L.length开始循环遍历到i，将元素挨个往后挪一个位置。<u>为了保证不越界，使用的是把前一个数据j - 1放到后一个数据j</u>，而不是把j放到j + 1</p>
        <p>而i处就是要插入的位置，此时j = i，j处的元素在j + 1处，j - 1 的元素不变，就空出来了一个位置，把元素放进去，长度L.length = L.length + 1</p>
        <p>最后，成功返回1</p>
        <p><pre><code class = 'language-c'>
int InsElem(SqList& L, ElemType x,int i)
{
	int j;
	if (i < 1 || i > L.length + 1 || L.length == MAX_SIZE)
	{
		return 0;//无效的i值或顺序表已满返回0
	}
	for (j = L.length; j >= i ; j--)
	{
		L.data[j] = L.data[j - 1];//将第i个位置及以后的元素向后移动一位
    }
		L.data[i - 1] = x;//在第i个位置插入新元素
		L.length++;//长度+1
		return 1;
}
        </code></pre></p>
        <p>本算法的时间复杂度为O(n)</p>
        <p>7. 删除运算算法</p>
        <p>思路：先判断能否删除，再将第i个位置及以后的元素向前移动一位，判断是否删除成功，长度-1</p>
        <p>判断位置有效同上一个算法。</p>
        <p>定义一个循环变量j，从i处开始遍历到末尾（此时的j是下标，关系：j是i - 1处的元素开始，不能到L.length，否则数组越界）。</p>
        <p>这里for循环的j就是从i + 1处开始到L.length - 1处遍历</p>
        <p>将后一个元素j放到前一个元素j - 1处（这里是把i + 1处的元素放到i处，用循环变量j来实现而已），最后将表长-1，成功返回1</p>
        <p><pre><code class = 'language-c'>
int DelElem(SqList& L, int i)
{
	int j;
	if (i < 1 || i > L.length)
	{
		return 0;//无效的i值返回0
	}
	for (j = i; j < L.length; j++)
	{
		L.data[j - 1] = L.data[j];//将第i个位置及以后的元素向前移动一位
	}
	L.length--;//长度-1
	return 1;
}
        </code></pre></p>
        <p>本算法的时间复杂度为O(n)</p>
        <p>8. 输出元素运算算法</p>
        <p>for循环，长度0~L.length - 1，输出数据。</p>
        <p><pre><code class = 'language-c'>
void DispList(SqList L)
{
	int i;
	for (i = 0; i < L.length; i++)
	{
		printf("%d ",L.data[i]);//循环输出元素，范围是0~L.length - 1
	}
    printf("\\n");
}
        </code></pre></p>
        <p>本算法的时间复杂度为O(n)</p>
        <p>函数的声明：</p>
        <p><pre><code class = 'language-c'>
void InitList(SqList& L);
void DestroyList(SqList L);
int GetLength(SqList L);
int GetElem(SqList L, int i, ElemType& e);
int Locate(SqList L, ElemType x);
int InsElem(SqList& L, ElemType x, int i);
int DelElem(SqList& L, int i);
void DispList(SqList L);
        </code></pre></p>
        <p>测试8个基本运算：（主函数）</p>
        <p><pre><code class = 'language-c'>
int main()
{
	int i;
	ElemType e;
	SqList L;

	InitList(L);
	InsElem(L,1,1);//插入元素1到位置1
	InsElem(L,3,2);//插入元素3到位置2

	printf("第%d个元素：%d\\n",i,e);
	e = 1;
	printf("元素%d是第%d个元素\\n",e,Locate(L,e));//按值查找元素e在顺序表中的位置
	i = 4;
	printf("删除第%d个元素：\\n",i);
	DelElem(L,i);//删除第i个元素
	printf("输出线性表：");
	DispList(L);//输出线性表
	DestroyList(L);//销毁线性表
    return 0;
}
        </code></pre></p>
        <p>本测试的时间复杂度为O(n)</p>
        <p>输出：</p>
        <p><线性表：1 3 1 5 4 2 长度:6</p>

        <p>在顺序表的八个算法中：</p>
        <p>时间复杂度为O(n)的是：按值查找，插入运算（后插），删除运算，输出元素</p>
        <p>在此篇来说：5，6，7，8的时间复杂度是O(n)</p>
        <p>时间复杂度O(1)的是：初始化，销毁，求表长，表的第i个元素</p>
        <p>也就是：1，2，3，4的时间复杂度是O(1)</p>

        fullContent:
        `<p>单链表（Linked List）是一种线性数据结构，它由一系列节点组成，每个节点包含一个数据元素和一个指向下一个节点的指针。单链表的特点是动态存储，插入和删除操作效率较高，但访问元素的效率较低。</p>
        <p>注意：单链表的头结点不存储数据，只作为标识。比如说：<u>L -> d1 -> d2 -> d3 -> NULL</u></p>
        <p>头结点就是L(无数据),首结点就是d1(有数据，位置为1，下标为1)</p>
        <p>单链表的定义如下：</p>
        <p><pre><code class = 'language-c'>
#define _CRT_SECURE_NO_WARNINGS
#include &ltstdio.h&gt
#include &ltstdlib.h&gt//包括了malloc函数的头文件

//单链表节点声明
typedef int ElemType;
typedef struct node
{
	ElemType data;//数据域
	struct node* next;//指针域
}SLinkNode;
        </code></pre></p>
        <p>上面的代码定义了单链表的节点结构体，其中包含一个数据域和一个指针域。数据域用于存储节点的数据，指针域用于指向下一个节点。</p>
        <p>下面是单链表的基本操作的实现：</p>
        <p>1. 初始化单链表</p>
        <p><pre><code class = 'language-c'>
//初始化单链表运算
void InitList(SLinkNode*& L)
{
	L = (SLinkNode*)malloc(sizeof(SLinkNode));//创建头结点L
	L->next = NULL;//L的指针域置为空，即链表中只有一个结点：首结点
}
        </code></pre></p>
        <p><u>就是这样的：L -> NULL</u></p>
        <p>本算法的时间复杂度为O(1)</p>
        <p>2. 销毁单链表</p>
        <p>先创建两个指针pre，p，pre指向头结点，p指向首结点，（pre在第一个，p在第二个）</p>
        <p>此时，p比pre先遍历完整个连链表，所以while循环的条件是当p != NULL 时，先释放pre,再把pre和p指向同一个位置，p再往后移一位，直到p指向NULL跳出循环。</p>
        <p>最后，pre指向的是链表的最后一个结点，此时再把pre指向的结点释放，就完成了销毁运算。</p>
        <p><pre><code class = 'language-c'>
//销毁单链表运算算法
void DestroyList(SLinkNode*& L)
	SLinkNode* pre = L;//pre头结点
	SLinkNode *p = pre->next;//首结点（和头结点相邻，为pre的下一个结点）
	while (p != NULL)
	{
		free(pre);//释放pre结点
		pre = p;//pre指针循环往后移
		p = p->next;//p指针循环往后同步移动
	}
	free(pre);//最后将pre指向的尾结点结点释放
}
        </code></pre></p>
        <p><u>L(pre) -> d1(p) -> d2 -> d3 -> NULL,然后d1(pre) -> d2(p) -> d3 -> NULL,最后d3(pre) -> NULL(p),此时在循环外面，再free(pre)就销毁完了</u></p>
        <p>本算法的时间复杂度是O(n)</p>
        <p>3. 求表的长度</p>
        <p>先定义一个计数器，记的是数组下标。</p>
        <p>创建一个指针p指向头结点，当p不为空时，计数器加1，然后p指向下一个结点，直到p为空，此时的计数器的值就是链表的长度（元素的个数）</p>
        <p><pre><code class = 'language-c'>
//求单链表的长度运算算法
int GetLength(SLinkNode* L)
{
	int i = 0;//计数器
	SLinkNode* p = L->next;//p指向头结点
	while (p != NULL)
	{
		i++;//计数器+1（p是第二个结点，第一次循环时i = 0，所以要先i++再指向下一个结点）
		p = p->next;//循环指向下一个结点
	}
	return i;
}
        </code></pre></p>
        <p><u>L -> d1(p) -> d2 -> d3 -> NULL，p往后移动一下，i就加1，直到p指向NULL，此时i的值就是链表的长度</u></p>
        <p>本算法的时间复杂度为O(n)</p>
        <p>4. 求表的第i个元素</p>
        <p>先定义一个计数器j，然后创建一个指针p指向头结点，先判断i的位置，当i <= 0时，返回0；当p不为空且j < i时，计数器加1，然后p指向下一个结点，直到p为空或j = i，此时j的值就是第i个元素的位置（当j=0时，p指向L,j = 1时，p指向第一个数据结点,此时的i=1）。</p>
        <p>所以i和j指向的是一个地方。然后把数据取出来放到e中，返回1。但是，在取元素之前，还要判断以下p是不是空的，因为在while中最后执行了p = p->next，跳出循环后p指向的就是下一个结点，但是这个结点还未判断是不是空的，所以还要再判断一次，再进行取元素的操作。</p>
        <p><pre><code class = 'language-c'>
//求单链表第i个元素运算算法
int GetElem(SLinkNode* L, int i, ElemType& e)
{
	int j = 0;//计数器
	SLinkNode* p = L;//指向头结点

	if (i <= 0)
	{
		return 0;//位置i <= 0，不合法，返回0
	}

	while (p != NULL && j < i)
	{
		j++;//同上一个算法（求单链表长度算法）
		p = p -> next;
	}

	if (p == NULL)
	{
		return 0;//p为空，没找到，返回0
	}
	else
	{
		e = p -> data;//元素放到e中
		return 1;
	}
}
        </code></pre></p>
        <p><u>L(p,j=0) -> d1(i=1) -> d2 -> d3(j=3,i=3,出while) -> NULL,比如i=3,p指向d3</u></p>
        <p>本算法的时间复杂度为O(n)</p>
        <p>5. 按值查找</p>
        <p>先定义一个计数器和指针p,p指向首结点（非头结点，因为j此时是1并且头结点不存元素，下标为0）</p>
        <p>循环判断p的data域是否等于e并且p是否为空，不为空且值不相同就计数器+1,p指针往后移。</p>
        <p>跳出循环时，p的data域等于e，p为空，所以分开判断，如果为空就返回0，不为空时，那就是p的data域等于e，此时的j就是元素e的位置（不是下标）</p>
        <p><pre><code class = 'language-c'>
//按值查找算法(返回第一次出现的位置)
int Locate(SLinkNode* L, ElemType e)
{
	int j = 1;//计数器
	SLinkNode* p = L -> next;

	while (p != NULL && p -> data != e)
	{
		p = p -> next;
		j++;
	}

	if (p == NULL)
	{
		return 0;//没找到
	}
	else
	{
		return j;//找到返回位置j
	}
}
        </code></pre></p>
        <p><u>L -> d1(p,i=1,j=1) -> d2 -> d3(j=3,i=3,出while) -> NULL,i=3时,值是d3,j=3,return 3</u></p>
        <p>本算法的时间复杂度为O(n)</p>
        <p>6. 插入</p>
        <p>思路：先找到要插入位置的前一个结点p，再创建一个新的结点s，先将s的next指针指向p的下一个结点，再将p的next指向s。</p>
        <p>首先判断插入位置的合法性，i不能<0，再循环判断p是否为空和j是否小于i-1，满足条件就循环往后移动，直到不满足。</p>
        <p>此时p为空或j = i - 1 = k(k是插入位置的下标),判断p是否为空（跳出循环前又往后移动了一位，所以要重新判断），然后执行插入操作。</p>
        <p>创建一个空间s，data是x，将s的next指针和p的next指针指向同一个空间，再将p的next连到s，就完成了插入。</p>
        <p><pre><code class = 'language-c'>
//插入元素算法
int InsElem(SLinkNode*& L, ElemType x, int i)
{
	int j = 0;//计数器，是下标
	SLinkNode* p = L;//指向头结点（也可以int k = i - 1）来让i变成下标k
	SLinkNode* s;
	if (i < 0)
	{
		return 0;
	}
	while (p != NULL && j < i-1)
    {//找到第i个位置的前一个结点p，j是计数器，p是指针
     //j从0开始，p从头结点开始，当j = i - 1时，p指向第i个位置的前一个结点
		j++;
		p = p -> next;
	}
	if (p == NULL)
	{
		return 0;
	}
	else
	{
		s = (SLinkNode*)malloc(sizeof(SLinkNode));//创建新结点s
		s->data = x;//把元素x放到s的data域
		s->next = p->next;//把s的next指针指向p的下一个结点
		p->next = s;//把p的next指针指向s
		return 1;
	}
}
        </code></pre></p>
        <p><u>L(p,j=0) -> d1(i=1,j=1,出while,p) -> d2(i=2,j=2) -> d3 -> NULL,i=2</u></p>
        <p><u>执行s->next = p->next时s(data=x) -> d2,原表变为L -> d1=s -> d2 -> d3 -> NULL</u></p>
        <p><u>执行p->next = s时链表变为L -> d1 -> s -> d2 -> d3 -> NULL,插入成功，在原来d2(i=2)的位置插入了新结点s</u></p>
        <p>本算法的时间复杂度为O(n)</p>
        <p>7. 删除</p>
        <p>思路：先找到要删除元素的前一个结点，修改next指针，指向删除元素的下一个结点，最后释放被删除的结点。</p>
        <p>前面的做法和上一个插入运算类似，这里只讲解删除操作。</p>
        <p>p的next指针指向的是要删除的结点的前一个结点，p指向的是要删除的结点。</p>
        <p>首先要判断q是否为空，不为空就先把p的next指针指向q的下一个结点，再释放q结点(先连q的下一个结点是为了防止断链)。</p>
        <p><pre><code class = 'language-c'>
//删除元素算法
int DelElem(SLinkNode*& L,int i)
{
	int j = 0;
	SLinkNode* p = L;
	SLinkNode* q;
	if (i <= 0)//位置i <= 0，不合法，返回0
	{
		return 0;
	}
	while (p != NULL && j < i - 1)
	{
		j++;
		p = p->next;
	}
	if (p == NULL)
	{
		return 0;
	}
	else
	{
		q = p -> next;//q指向要删除的结点
		if (q == NULL)//要删除的结点不存在，返回0
		{
			return 0;
		}
		else
		{
			p->next = q->next;//把p的next指针指向q的下一个结点
			free(q);//释放q结点
			return 1;
		}
	}
}
        </code></pre></p>
        <p><u>L(p,j=0) -> d1(j=1,i=1,出while,p) -> d2(j=2,i=2) -> d3 -> NULL,i=2(删d2)</u></p>
        <p><u>执行q = p -> next时，链表变为L -> d1(p) -> d2(p) -> d3 -> NULL</u></p>
        <p><u>执行p->next = q->next时，链表变为L -> d1(p) -> d3 -> NULL 且 d2(q) -> d3,将d2和d1的链断了，但是和d3的链还存在</u></p>
        <p><u>最后执行free(q),释放q结点，链表变成了：L -> d1(p) -> d3 -> NULL,删除成功</u></p>
        <p>本算法的时间复杂度为O(n)</p>
        <p>8. 输出元素</p>
        <p><pre><code class = 'language-c'>
//输出单链表运算算法
void DispList(SLinkNode* L)
{
	SLinkNode* p = L -> next;
	while (p != NULL)
	{
		printf("%d ",p->data);
		p = p->next;
	}
}
        </code></pre></p>
        <p>本算法的时间复杂度为O(n)</p>
        <p>函数声明：</p>
        <p><pre><code class = 'language-c'>
//函数的声明
void InitList(SLinkNode*& L);
void DestroyList(SLinkNode*& L);
int GetLength(SLinkNode* L);
int GetElem(SLinkNode* L, int i, ElemType& e);
int Locate(SLinkNode* L, ElemType e);
int InsElem(SLinkNode*& L, ElemType x, int i);
int DelElem(SLinkNode*& L, int i);
void DispList(SLinkNode* L);
        </code></pre></p>
        <p>测试8个基本运算：（主函数）</p>
        <p><pre><code class = 'language-c'>
//主函数
int main()
{
	int i;
	ElemType e;
	SLinkNode* L;

	InitList(L);
	InsElem(L,1,1);
	InsElem(L,3,2);
	InsElem(L,1,3);
	InsElem(L,5,4);
	InsElem(L,4,5);
	InsElem(L,2,6);
	printf("单链表：");
	DispList(L);
	printf("长度：%d\\n",GetLength(L));
	i = 3;
	GetElem(L,i,e);
	printf("第%d个元素：%d\\n",i,e);
	e = 1;
	printf("元素%d是第%d个元素\\n",e,Locate(L,e));
	i = 4;
	printf("删除第%d个元素\\n",i);
	DelElem(L,i);
	printf("输出单链表：");
	DispList(L);
	DestoryList(L);
	return 0;
}
        </code></pre></p>
        <p>本测试的时间复杂度为O(n)</p>
        <p>输出：</p>
        <p>单链表：1 3 1 5 4 2</p>
        <p>长度：6</p>
        <p>第3个元素：1</p>
        <p>元素1是第1个元素</p>
        <p>删除第4个元素</p>
        <p>输出单链表：1 3 1 4 2</p>
        <p>&nbsp;</p>
        <p>总结：</p>
        <p>在单链表的八个算法中：</p>
        <p>时间复杂度为O(n)的是：销毁单链表，求表的长度，求表的第i个元素，按值查找，插入运算，删除运算，输出元素</p>
        <p>在此篇来说：2，3，4，5，6，7，8的时间复杂度是O(n)</p>
        <p>时间复杂度O(1)的是：初始化单链表</p>
        <p>也就是：1的时间复杂度是O(1)</p>

        fullContent:
        `<p>循环单链表（Circular Single Linked List）是一种特殊的单链表，其中最后一个节点的指针指向第一个节点，形成一个环状结构。循环单链表的特点是可以从任意节点开始遍历整个链表，适用于需要循环访问数据的场景。</p>
        <p>就是尾结点的next指向头结点(把尾结点的next域由原来的NULL改为指向头结点)。特点是：从任一结点出发都可以找到表中其他结点。</p>
        <p>循环单链表的定义如下：</p>
        <p><pre><code class = 'language-c'>
#define _CRT_SECURE_NO_WARNINGS
#include &ltstdio.h&gt
#include &ltstdlib.h&gt

typedef int ElemType;
typedef struct node
{
	ElemType data;
	struct node* next;
}CSLinkNode;
        </code></pre></p>
        <p>上面的代码定义了循环单链表的节点结构体，其中包含一个数据域和一个指针域。数据域用于存储节点的数据，指针域用于指向下一个节点。</p>
        <p>循环单链表的基本操作与单链表类似，只是在遍历时需要注意循环的条件，以避免死循环。具体实现可以参考单链表的操作，只需在适当的位置修改指针的指向即可。</p>
        <p>上面的代码就是循环单链表的定义</p>
        <p>下面是循环单链表的8个基本操作的实现：</p>
        <p>1. 初始化循环单链表运算算法</p>
        <p><pre><code class = 'language-c'>
void InitList(CSLinkNode*& L)
{
	L = (CSLinkNode*)malloc(sizeof(CSLinkNode));//创建头结点L
    L -> next = L;//L的指针域指向自己，即链表中只有一个结点：头结点
}
        </code></pre></p>
        <p>本算法的时间复杂度为O(1)</p>
        <p>2. 销毁循环单链表运算算法</p>
        <p>先创建两个指针pre，p，pre指向头结点，p指向头结点的下一个结点（也就是第一个数据结点）。</p>
        <p>此时，p比pre先遍历完整个连链表，所以while循环的条件是当p != L时，先释放pre,再把pre和p指向同一个位置，p再往后移一位，直到p指向L跳出循环。</p>
        <p>最后，pre指向的是链表的最后一个结点，此时再把pre指向的结点释放，就完成了销毁运算。</p>
        <p><pre><code class = 'language-c'>
void DestroyList(CSLinkNode* L)
{
	CSLinkNode* pre,*p;
	pre = L;
	p = L->next;
	while (p != L)
	{
		free(pre);
		pre = p;
		p = p->next;
	}
	free(pre);
}
        </code></pre></p>
        <p>本算法的时间复杂度是O(n)</p>
        <p>3. 求表的长度</p>
        <p>算法和单链表类似，所以就不讲解了。</p>
        <p><pre><code class = 'language-c'>
int GetLength(CSLinkNode* L)
{
	int i = 0;
	CSLinkNode* p = L->next;
	while (p != L)
	{
		i++;
		p = p->next;
	}
	return i;
}
        </code></pre></p>
        <p>本算法的时间复杂度为O(n)</p>
        <p>4. 求表的第i个元素</p>
        <p>表的结构类似于：L -> data1 -> data2 -> ... -> dataN -> L</p>
        <p>首先定义一个计数器j，从1开始，指针p指向第一个数据节点（首结点）</p>
        <p>判断位置i是否有效,就是判断i是否在[1, GetLength(L)]范围内。然后while循环，以p是否为L并且j < i为条件，循环使得p指向第下一个结点，直到p指向位置i，所以跳出循环的条件就是p == L或者j == i</p>
        <p>由于出循环后没有判断p是否为L，所以需要在循环后添加判断。不为L,就把p->data赋值给e</p>
        <p><pre><code class = 'language-c'>
int GetElem(CSLinkNode* L, int i, ElemType& e)
{
	int j = 1;
	CSLinkNode* p = L->next;
	if (i <= 0)
	{
		return 0;
	}
	while (p != L && j < i)
	{
		j++;
		p = p->next;
	}
	if (p == L)
	{
		return 0;
	}
	else
	{
		e = p->data;
		return 1;
	}
}   
        </code></pre></p>
        <p>本算法的时间复杂度为O(n)</p>

        </code></pre></p>
        <p>本算法的时间复杂度为O(n)</p>
        <p>6. 插入</p>
        <p>首先定义了一个计数器j，从1开始，pre指向头结点，p指向首结点（也就是第一个数据结点），p和pre相邻。</p>
        <p>判断位置i是否有效，将pre和p一起往后移动，直到j==i或者p==L</p>
        <p>判断此时的p是否为L,<u>并且判断i >j + 1（i是位置，j也是位置，i的最大值是j - 1,超过就不是合法位置）</u></p>
        <p>然后创建结点s，data域为x,s的next指针和pre指针指向同一个空间p（插入前的位置关系是：pre -> p，这一步是pre = s -> p），然后更改pre指针,使它指向s结点(pre -> s -> p)，于是便插入成功了。</p>
        <p><pre><code class = 'language-c'>
int InsElem(CSLinkNode*& L, ElemType x, int i)
{
	int j = 1;
	CSLinkNode* pre = L;
	CSLinkNode* p = pre->next;
	CSLinkNode* s;
	if (i <= 0)
	{
		return 0;
	}
	while (p != L && j < i )
	{
		j++;
		pre = p;
		p = p->next;
	}
	if (p == L && i >j + 1)//当i > j + 1时，说明i不是合法位置，返回0
	{
		return 0;
	}
	else
	{
		s = (CSLinkNode*)malloc(sizeof(CSLinkNode));
		s->data = x;
		s->next = pre->next;
		pre->next = s;
		return 1;
	}
}

int DelElem(CSLinkNode*& L, int i)
{
	int j = 0;
	CSLinkNode* p = L, * post;//p指向的是头结点
	if (i <= 0)
	{
		return 0;
	}
	while (p->next != L && j < i - 1)//首结点（第一个数据结点）为L的时候就是这样(L -> L)，所以p->next != L的条件是为了找到第i个位置的前一个结点，j是计数器，p是指针
	{
		j++;
		p = p->next;
	}
	if (p->next == L)//和上面一样，删除位置不合法，返回0
	{
		return 0;
	}
	else
	{
		post = p->next;//post指向被删除元素
		if (post == L)//L -> d1 -> d2 -> d3 -> L,当post指向L时，说明要删除的元素不存在，返回0
		{
			return 0;
		}
		else//post指向要删除的结点，p指向要删除结点的前一个结点，比如上面的例子，当要删除d2时，post指向d2，p指向d1，此时把p的next指针指向post的下一个结点（d3），再释放post结点，就完成了删除操作。
		{
			p->next = post->next;//这一步就是把p的next指针指向post的下一个结点
			free(post);//释放post结点
			return 1;
		}
	}
}
        </code></pre></p>

        `<p>双链表（Doubly Linked List）是一种线性数据结构，它由一系列节点组成，每个节点包含一个数据元素和两个指针，分别指向前一个结点（前驱结点）和后一个结点（后继结点）。链表的特点是动态存储，插入和删除操作效率较高，但访问元素的效率较低。</p>
        <p>而在单链表中，每个结点的指针指向下一个结点（后继结点），故从任一结点找其后继结点很方便，但是找前驱结点比较困难。在双链表中，增加了一个指向前驱结点的指针域prior，这样形成的链表就有两条不同方向的链，使得从给定结点出发查找其前驱结点和后继结点都变得很方便。</p>

{

}DLinkNode;

        <p>双链表的基本操作与单链表类似，只是在遍历时需要注意前驱结点和后继结点的关系，以确保正确地更新指针。具体实现可以参考单链表的操作，只需在适当的位置修改指针的指向即可。</p>

        `<p>栈（Stack）是一种线性数据结构，它遵循后进先出（LIFO）的原则。栈中的元素只能在一端进行插入和删除操作，这一端被称为栈顶。栈的基本操作包括入栈（push）、出栈（pop）和获取栈顶元素（top）。</p>

        <p><pre><code class = 'language-c'>
#define _CRT_SECURE_NO_WARNINGS
#define MAX_SIZE 100
#include &ltstdio.h&gt

typedef int ElemType;
typedef struct
{
	ElemType data[MAX_SIZE];
	int top;
}SqStack;
        </code></pre></p>

        <p>下面是栈的基本操作的实现：</p>
        <p>1. 初始化栈</p>
        <p><pre><code class = 'language-c'>
void InitStack(SqStack& st)
{
	st.top = -1;//栈顶指针初始化为-1，表示栈为空
}

        <p>本算法的时间复杂度为O(1)</p>

        <p><pre><code class = 'language-c'>
void DestroyStack(SqStack st)
{
    //顺序栈是静态分配的，不需要时会自动释放内存，所以销毁栈的操作可以不做任何处理。
}
        </code></pre></p>
        <p>3. 入栈</p>
        <p><pre><code class = 'language-c'>
int Push(SqStack& st,ElemType x)
{
	if (st.top == MAX_SIZE - 1)//栈满，无法入栈
	{
		return 0;
	}
	else
	{
		st.top++;//栈顶指针先加1，再将元素放到栈顶
		st.data[st.top] = x;//将元素放到栈顶
		return 1;
	}
}

        <p><pre><code class = 'language-c'>
int Pop(SqStack& st, ElemType& x)
{
	if (st.top == -1)//栈空，无法出栈
	{
		return 0;
	}
	else
	{
		x = st.data[st.top];//将栈顶元素放到x中
		st.top--;//栈顶指针减1，表示出栈成功
		return 1;
	}
}

        `<p>链栈是一种基于链表实现的栈数据结构，它遵循后进先出（LIFO）的原则。链栈中的元素通过节点链接在一起，每个节点包含一个数据元素和一个指向下一个节点的指针。链栈的基本操作包括入栈（push）、出栈（pop）和获取栈顶元素（top）等算法。</p>
        <p>链栈的定义如下：</p>
        <p><pre><code class = 'language-c'>
#define _CRT_SECURE_NO_WARNINGS

#include &ltstdio.h&gt
#include &ltstdlib.h&gt

{

        <p><pre><code class = 'language-c'>

        <p>本算法的时间复杂度为O(1)</p>
        <p>2. 销毁链栈</p>
        <p><pre><code class = 'language-c'>
void DestroyStack(LinkStack* ls)
{
	LinkStack* pre = ls;//pre指向首结点
	LinkStack* p;//p指向pre的下一个结点，但是要先判断pre是否为NULL，否则会出错

	if (pre == NULL)
	{
		return;
	}

	p = pre->next;//p指向pre的下一个结点

	while (p != NULL)
	{
		free(pre);//释放pre结点
		pre = p;//pre指针循环往后移
		p = p->next;//p指针循环往后同步移动
	}
	free(pre);
}
        </code></pre></p>

int Push(LinkStack*& ls, ElemType x)
{
	LinkStack* p;

	p->data = x;//将元素x放到p的data域中
	p->next = ls;//将p的next指针指向当前的栈顶结点ls
	ls = p;//将p赋值给ls，表示p成为新的栈顶结点
	return 1;
}

	if (ls == NULL)

	{

		x = p->data;//将栈顶元素放到x中
		ls = p->next;//将p的下一个结点赋值给ls，表示出栈成功
		free(p);//释放p结点
		return 1;
	}
}

        `<p>队列（Queue）是一种线性数据结构，它遵循先进先出（FIFO）的原则。队列中的元素只能在一端进行插入操作，这一端被称为队尾；只能在另一端进行删除操作，这一端被称为队头。队列的基本操作包括入队（enqueue）、出队（dequeue）和获取队头元素（gethead）等算法。</p>
        <p>本篇讲的是顺序队列的实现，链队列在下一篇哦~</p>
        <p>队列的定义如下：</p>
        <p><pre><code class = 'language-c'>

        <p><pre><code class = 'language-c'>
int EnQueue(SqQueue& sq, ElemType x)
{
	if ((sq.rear + 1) % MAX_SIZE == sq.front)
	{
		return 0;
	}
	else
	{
		sq.rear = (sq.rear + 1) % MAX_SIZE;
		sq.data[sq.rear] = x;
		return 1;
	}
}

}

void StrCopy(SqString& s, SqString t)
{
	int i;
	for (i = 0; i < t.length; i++)
	{
		s.data[i] = t.data[i];
	}
	s.length = t.length;
}
        </code></pre></p>
        <p>本算法的时间复杂度为O(n)，其中n是输入字符串t的长度。</p>
        <p>4. 求串长</p>
        <p><pre><code class = 'language-c'>
int StrLength(SqString s)
{
	return s.length;
}
        </code></pre></p>
        <p>本算法的时间复杂度为O(1)</p>
        <p>5. 判断串相等</p>
        <p><pre><code class = 'language-c'>
int StrEqual(SqString s, SqString t)
{
	int i = 0;
	if (s.length != t.length)
	{
		return 0;
	}
	else
	{
		for (i = 0; i < s.length; i++)
		{
			if (s.data[i] != t.data[i])
			{
				return 0;
			}
		}
		return 1;
	}
}
        </code></pre></p>
        <p>本算法的时间复杂度为O(n)，其中n是输入字符串s和t的长度。</p>
        <p>6. 字符串连接</p>
        <p><pre><code class = 'language-c'>
SqString Concat(SqString s, SqString t)
{
	SqString r;
	int i;
	int j;
	for (i = 0; i < s.length; i++)
	{	
		r.data[i] = s.data[i];
	}
	for (j = 0; j < t.length; j++)
	{
		r.data[s.length + j] = t.data[j];
	}
	r.length = i + j;
	return r;
}
        </code></pre></p>
        <p>本算法的时间复杂度为O(n)，其中n是输入字符串s和t的长度之和。</p>
        <p>7. 求子串</p>
        <p><pre><code class = 'language-c'>
SqString SubStr(SqString s, int i,int j)
{
	SqString t;
	int k;
	if (i < 1 || i > s.length || j < 1 || i + j > s.length + 1)
	{
		t.length = 0;
	}
	else
	{
		for (k = i - 1; k < i + j - 1; k++)
		{
			t.data[k - i + 1] = s.data[k];
		}
		t.length = j;
	}
	return t;
}
        </code></pre></p>
        <p>本算法的时间复杂度为O(n)，其中n是输入字符串s的长度。</p>
        <p>8.查找子串位置，即串匹配</p>
        <p><pre><code class = 'language-c'>
int Index(SqString s, SqString t)
{
	int i = 0;
	int j = 0;
	while (i < s.length && j < t.length)
	{
		if (s.data[i] == t.data[j])
		{
			i++;
			j++;
		}
		else
		{
			i = i - j + 1;
			j = 0;
		}
	}
	if (j >= t.length)
	{
		return i - t.length + 1;
	}
	else
	{
		return 0;
	}
}
        </code></pre></p>
        <p>本算法的时间复杂度为O(m*n)，其中m和n分别是输入字符串s和t的长度。</p>
        <p>9. 插入子串</p>
        <p><pre><code class = 'language-c'>
int InsStr(SqString& s,int i, SqString t)
{
	int j;
	if (i < 1 || i > s.length + 1 || s.length == MAX_SIZE)
	{
		return 0;
	}
	else
	{
		for (j = s.length - 1; j >= i - 1; j--)
		{
			s.data[j + t.length] = s.data[j];
		}
		for (j = 0;j < t.length;j++)
		{
			s.data[i + j - 1] = t.data[j];
		}
		s.length = s.length + t.length;
		return 1;
	}
}
        </code></pre></p>
        <p>本算法的时间复杂度为O(n)，其中n是输入字符串s的长度。</p>
        <p>10. 删除子串</p>
        <p><pre><code class = 'language-c'>
int DelStr(SqString& s, int i, int j)
{
	int k;
	if (i < 1 || i > s.length || j < 1 || i + j > s.length + 1)
	{
		return 0;
	}
	else
	{
		for (k = i + j - 1; k < s.length; k++)
		{
			s.data[k - j] = s.data[k];
		}
		s.length = s.length - j;
		return 1;
	}
}
        </code></pre></p>
        <p>本算法的时间复杂度为O(n)，其中n是输入字符串s的长度。</p>
        <p>11. 替换子串</p>
        <p><pre><code class = 'language-c'>
SqString RepStrAll(SqString s,SqString s1,SqString s2)
{
	int i;
	i = Index(s,s1);
	while (i > 0)
	{
		DelStr(s, i, s1.length);
		InsStr(s, i,s2);
		i = Index(s,s1);
	}
	return s;
}
        </code></pre></p>
        <p>本算法的时间复杂度为O(m*n)，其中m和n分别是输入字符串s和s1的长度。</p>

        <p><pre><code class = 'language-c'>

        <p>链串的基本操作包括创建链串、销毁链串、计算链串长度、连接链串等算法。由于链串的实现基于链表，因此在操作链串时需要考虑节点的动态分配和释放。</p>
        <p>链串的定义如下：</p>
        <p><pre><code class = 'language-c'>
#define _CRT_SECURE_NO_WARNINGS

        <p>上面的代码定义了链串的数据结构，其中包含一个字符数据域用于存储字符串中的字符和一个指针域用于指向下一个节点。</p>
        <p>1. 串赋值</p>
        <p><pre><code class = 'language-c'>
void Assign(LinkString*& s, char str[])
{
	int i = 0;
	LinkString* p;//新结点
	LinkString* tc;//尾指针

	s = (LinkString*)malloc(sizeof(LinkString));

	while (str[i] != '\\0')
	{
		p = (LinkString*)malloc(sizeof(LinkString));
		p->data = str[i];
		tc->next = p;
		tc = p;
		i++;
	}
	tc->next = NULL;
}

void DestroyStr(LinkString*& s)

		p = p->next;
	}
	free(pre);
}

        title:"数组与稀疏矩阵",
        language:"c",
        fullContent:
        `<p>数组是一种线性数据结构，用于存储固定大小的元素集合。稀疏矩阵是一种特殊的矩阵，其中大部分元素为零。为了节省存储空间和提高计算效率，稀疏矩阵通常使用特殊的数据结构来存储非零元素的位置和值，如压缩行存储（CSR）或压缩列存储（CSC）等。</p>
        <p>1. 数组的定义</p>
        <p>一维数组是n(n > 1)个相同性质的数据元素构成的有限序列，它本身就是一个线性表。</p>
        <p>二维数组可以看成是这样的一个线性表，它的每个数据元素也是一个线性表。结构类似矩阵</p>
        <p>几乎所有的高级语言都实现了数组数据结构，称为数组类型。</p>
        <p><ol style= "list-style:none">
            <li>①一个数组中所有元素具有相同的数据类型。</li>
            <li>②数组一旦被定义，他的维数和每维的大小就不再改变。</li>
            <li>③数组中每个元素对应唯一的下标，可以通过该下标对元素进行存取操作。</li>
        </ol></p>
        <p>&nbsp;</p>
        <p>2. 数组的存储结构</p>
        <p>通常为顺序结构，因为数组一般不作插入删除运算。</p>
        <p>存储次序：</p>
        <p>二维数组的存储次序有两种情况：按行优先和按列优先。</p>
        <p>(1). 首先来说按行优先：</p>
        <p>假设每个元素占k个存储单元，LOC(a<sub>0,0</sub>)表示a<sub>0,0</sub>元素的存储地址，对于元素a<sub>i,j</sub>来说，它的地址是：</p>
        <p>LOC(a<sub>i,j</sub>) = LOC(a<sub>0,0</sub>) + (i * n + j) * k</p>
        <p>位置 = 起始地址 + (i * 每行的n个元素(<u>是乘个数，而不是累乘元素</u>) + j ) * k(k是每个元素占的存储单元)</p>
        <p>(2). 按列优先：</p>
        <p>LOC(a<sub>i,j</sub>) = LOC(a<sub>0,0</sub>) + (j * m + i) * k</p>
        <p>m:列的元素个数</p>
        <p>&nbsp;</p>
        <p>3. 特殊矩阵的压缩矩阵</p>
        <p>特殊矩阵：零元素或非零元素的分布有一定规律的矩阵。主要形式有：对称矩阵，对角矩阵等，它们都是方阵（行列数相等）。</p>
        <p>对称矩阵：若一个方阵A = {a<sub>i,j</sub>}中的元素满足a<sub>i,j</sub> = a<sub>j,i</sub>(0 <= i,j <= n-1),则称其为n阶对称矩阵。</p>
        <p>可分为三个部分：上三角部分(i < j)，下三角部分(i > j)，主对角线部分(i = j)</p>
        <p>对于A中任一元素a<sub>i,j</sub>和B中元素b<sub>k</sub>之间存在如下对应关系：</p>
        <p>
        <math display="block">
            <mi>k</mi>
            <mo>=</mo>
            <mrow>
            <mo>{</mo>
            <mtable columnalign="left left" rowspacing="4pt">
                <mtr>
                <mtd>
                    i(i + 1)/2 + j
                </mtd>
                <mtd>
                    <mtext>&nbsp;当 </mtext>
                    i≥j
                    <mtext>时 </mtext>
                </mtd>
                </mtr>
                <mtr>
                <mtd>
                    j(j + 1)/2 + i
                </mtd>
                <mtd>
                    <mtext>&nbsp;当 </mtext>
                    i < j
                    <mtext>时 </mtext>
                </mtd>
                </mtr>
            </mtable>
            </mrow>
        </math>
        </p>
        <p>有些非对称的矩阵也可借用上述方法存储，如n阶下（上）三角矩阵。所谓n阶下（上）三角矩阵，是指矩阵的上（下）三角部分（不包括主对角线）中的元素均为常数c的n阶方阵。</p>
        <p>设以一维数组B = {b<sub>k</sub>}作为n阶三角矩阵A的存储结构，B中元素的个数为n(n + 1)/2 + 1(其中常数c占用一个元素空间),则A中任意元素a<sub>i,j</sub>和B中元素b<sub>k</sub>之间存在着如下对应关系:</p>
        <p>上三角矩阵：</p>
        <p>
        <math display="block">
            <mi>k</mi>
            <mo>=</mo>
            <mrow>
            <mo>{</mo>
            <mtable columnalign="left left" rowspacing="4pt">
                <mtr>
                <mtd>
                    i(2n - i + 1)/2 + j - i
                </mtd>
                <mtd>
                    <mtext>&nbsp;当 </mtext>
                    i ≤ j
                    <mtext>时 </mtext>
                </mtd>
                </mtr>
                <mtr>
                <mtd>
                    n(n + 1)/2
                </mtd>
                <mtd>
                    <mtext>&nbsp;当 </mtext>
                    i > j
                    <mtext>时 </mtext>
                </mtd>
                </mtr>
            </mtable>
            </mrow>
        </math>
        </p>
        <p>下三角矩阵：</p>
        <p>
        <math display="block">
            <mi>k</mi>
            <mo>=</mo>
            <mrow>
            <mo>{</mo>
            <mtable columnalign="left left" rowspacing="4pt">
                <mtr>
                <mtd>
                    i(i + 1)/2 + j
                </mtd>
                <mtd>
                    <mtext>&nbsp;当 </mtext>
                    i≥j
                    <mtext>时 </mtext>
                </mtd>
                </mtr>
                <mtr>
                <mtd>
                    n(n + 1)/2
                </mtd>
                <mtd>
                    <mtext>&nbsp;当 </mtext>
                    i < j
                    <mtext>时 </mtext>
                </mtd>
                </mtr>
            </mtable>
            </mrow>
        </math>
        </p>
        <p>其中，B的最后元素b<sub>n(n + 1)/2</sub>中存放常数c。</p>
        <p>&nbsp;</p>
        <p>4. 稀疏矩阵</p>
        <p>稀疏矩阵：一个阶数较大的矩阵中非零元素的个数s相对于矩阵元素的总个数t非常小时的矩阵。</p>
        <p>稀疏矩阵的压缩存储方法是只存储非零元素，主要有三元组和十字链表。</p>
    `},

        category:"数据结构",
        title:"树（Tree）",
        language:"c",
        fullContent:
        `<p>1. 树的定义：</p>
        <p>树（Tree）是一种非线性数据结构，由节点组成，其中每个节点包含一个数据元素和指向其子节点的指针。树具有层次结构，常用于表示具有父子关系的数据，如文件系统、组织结构等。树的基本操作包括插入、删除、遍历等算法。</p>
        <p>从数据结构角度来说，树是一种层次化的数据结构，它由节点和边组成，其中每个节点可以有零个或多个子节点，但只有一个父节点（除了根节点）。</p>
        <p>树包含n(n>=0)个结点,当n=0时，树为空树。</p>
        <p>树的基本概念：</p>
        <p>（1）根节点（Root）：树的顶层节点，没有父节点。</p>
        <p>（2）内部节点（Internal Node）：具有至少一个子节点的节点。</p>
        <p>（3）路径（Path）：从一个节点到另一个节点的节点序列。</p>
        <p>（4）子树（Subtree）：树中某个节点及其所有后代节点组成的树。</p>
        <p>&nbsp;</p>
        <p>2. 树的逻辑结构表示：</p>
        <p>有树状表示法、文氏图表示法、凹入表示法和括号表示法等。</p>
        <p>&nbsp;</p>
        <p>3. 树的基本术语：</p>
        <p><ol style= "list-style:none">
            <li>(1)结点的度：节点拥有的子节点数。</li>
            <li>(2)树的度：树中节点的最大子节点数。</li>
            <li>(3)分支结点：具有子节点（度大于0）的节点。</li>
            <li>(4)叶子结点(叶结点)：没有子节点（度为0）的节点，也被称为终端节点。</li>
            <li>(5)孩子结点：某个节点的后继称为该结点的孩子结点。</li>
            <li>(6)双亲结点（父亲结点）：一个结点称为其后继结点的双亲结点。</li>
            <li>(7)子孙结点：一个结点的子树中除该结点外的所有节点。</li>
            <li>(8)祖先结点：某个节点的所有前驱节点（不包括自己）。</li>
            <li>(9)兄弟结点：具有相同父亲节点的节点，互相称为兄弟结点。</li>
            <li>(10)结点层次（结点深度）：从根节点到某个节点的路径长度。</li>
            <li>(11)树的高度：从根节点到叶子节点的最长路径长度。</li>
            <li>(12)森林：由0棵或多棵互不相交的树组成的集合。</li>
        </ol></p>
        <p>&nbsp;</p>
        <p>4. 树的性质</p>
        <p>(1) 树中的结点数等于所有结点的度数之和加1。</p>
        <p>(2) 度为m的树中第i层上至多有m<sup>i-1</sup>个结点。</p>
        <p>所以，当一棵m次树的第i层有m<sup>i-1</sup>个结点时，称该层是满的，若一棵m次树的所有叶子结点在同一层，并且每一层都是满的，则称该树为满m次树。</p>
        <p>(3) 高度为h的m次树最多有(m<sup>h</sup>-1)/(m-1)个结点。</p>
        <p>所以，当一棵高度为h的m次树上的结点数等于(m<sup>h</sup>-1)/(m-1)时，称该层是满的，则称该树为满m次树。</p>
        <p>&nbsp;</p>
        <p>5. 树的基本运算</p>
        <p>树的运算主要分为以下三类：</p>
        <p>(1) 查找满足某种特定关系的结点</p>
        <p>(2) 插入或删除某个结点</p>
        <p>(3) 遍历树的结点</p>
        <p>其中，遍历运算主要有先根遍历、层次遍历和后根遍历。</p>
        <p>先根遍历：访问根节点，然后递归地访问左子树和右子树。</p>
        <p>层次遍历：按树的层次从上到下，从左到右访问节点。</p>
        <p>后根遍历：递归地访问左子树和右子树，然后访问根节点。</p>
        <p>&nbsp;</p>
        <p>6. 树的存储结构</p>
        <p>在计算机中存储一棵树，不仅要存储树中每个结点的值，还要存储结点与结点之间的关系。</p>
        <p>下面介绍三种常用的存储结构：</p>
        <p>(1) 双亲存储结构：用一个一维数组存储树中的各个结点，数组元素是一个记录，包含data和parent两个域，分别表示结点值和其双亲在数组中的下标。在这个一维数组中，树中结点可按任意顺序存放。</p>
        <p>在双亲存储结构中，找某个结点的双亲或祖先是很方便的，但要找某个结点的孩子或兄弟结点则较耗时，需要遍历整个数组。</p>
        <p>(2) 孩子链存储结构：在这种存储结构中，每个结点不仅包含结点值，还包括指向所有孩子结点的指针。由于树中每个结点的子树个数（即结点的度）可能不同，如果按各个结点的度设计变长结构，则每个结点的孩子结点指针域个数增加使算法实现非常麻烦。孩子链存储结构可按树的度（即树中所有结点的最大度数）设计结点的孩子结点指针域个数。</p>
        <p>显然，在孩子链存储结构中，查找某个结点的孩子结点很容易，但找结点的双亲结点则较耗时；而且当树的度较大时，这种存储结构十分耗费空间。</p>
        <p>(3) 孩子兄弟链存储结构：孩子兄弟链存储结构是一种二叉链表，链表中每个结点包含两个指针，分别指向对应结点的第一个孩子和下一个兄弟。</p>
        <p>孩子兄弟链存储结构的优点、缺点和孩子链存储结构的优缺点一样，查找双亲比较耗时，查找孩子结点比较容易，但由于每个结点只有两个指针域，较孩子链存储结构节省空间。</p>
    `},

        <p>二叉树的递归定义为：二叉树或者是一棵空树，或者是一棵由一个根节点和两棵互不相交的左右子树组成。所组成的非空树，左子树和右子树又同样都是一棵二叉树。</p>

        title:"C语言中的数据类型，关键字和注释",
        language:"c",
        fullContent:
        `<p>1. C语言中的数据类型是用来定义变量的类型和大小的。C语言提供了多种基本数据类型，包括整数类型、浮点类型、字符类型等。</p>
        <p>整数类型包括int、short、long等，用于存储整数值。浮点类型包括float和double，用于存储小数值。字符类型是char，用于存储单个字符。</p>
        <p>C语言还支持派生数据类型，如数组、结构体、联合体和枚举类型。数组用于存储一组相同类型的元素，结构体用于定义一个包含多个不同类型成员的数据结构，联合体用于定义一个可以存储不同类型数据的变量，枚举类型用于定义一组命名的整数常量。</p>
        <p>此外，C语言还提供了void类型，用于表示无类型或函数不返回值的情况。指针类型也是C语言中的重要数据类型，用于存储变量的地址。</p>
        <p>总之，C语言中的数据类型丰富多样，提供了灵活的方式来定义和操作不同类型的数据，是C语言编程的基础。</p>
        <p>举个例子：</p>
        <p><pre><code class = 'language-c'>
#include &ltstdio.h&gt
int main()
{
    int a = 5; // 定义一个整型变量a并赋值为5
    float b = 3.14; // 定义一个浮点型变量b并赋值为3.14
    char c = 'A'; // 定义一个字符型变量c并赋值为'A'
    printf("a = %d, b = %f, c = %c\\n", a, b, c); // 输出变量的值
    return 0;
}
        </code></pre></p>
        <p>上面的代码展示了C语言中不同类型变量的定义和使用方法。</p>
        <p>&nbsp;</p>
        <p>2. C语言的关键字包括：break、case、char、const、continue、default、do、double、else、enum、extern、float、for、goto、if、int、long、return、short、signed、sizeof、static、struct、switch、typedef、unsigned、void、while</p>
        <p>这些关键字在C语言中具有特殊的意义，不能用作变量名或函数名。</p>
        <p>&nbsp;</p>
        <p>3. C语言中的注释有两种形式：单行注释和多行注释。单行注释以//开头，表示该行后面的内容是注释；多行注释以/*开头，以*/结尾，表示其中的内容都是注释。</p>
        <p>注释用于解释代码的功能和逻辑，帮助程序员理解代码的意图和实现细节。良好的注释可以提高代码的可读性和维护性。</p>
        <p>举个例子：</p>
        <p><pre><code class = 'language-c'>
#include &ltstdio.h&gt
int main()
{
    // 这是一个单行注释
    int a = 5; /* 这是一个多行注释 */
    printf("a = %d\\n", a);
    return 0;
}
        </code></pre></p>
        <p>上面的代码展示了C语言中单行注释和多行注释的使用方法。</p>
    `},

        language:"c",
        fullContent:
        `<p>C语言中的输入输出函数是用来与用户进行交互的函数。常用的输入输出函数包括printf和scanf。</p>
        <p>printf函数用于向控制台输出格式化的数据。它的语法是printf("格式字符串", 参数列表);。格式字符串中可以包含普通字符和格式说明符，用于指定输出数据的格式。</p>
        <p>scanf函数用于从控制台读取格式化的数据。它的语法是scanf("格式字符串", 参数列表);。格式字符串中可以包含普通字符和格式说明符，用于指定输入数据的格式。</p>
        <p>举个例子：</p>
        <p><pre><code class = 'language-c'>
#include &ltstdio.h&gt
int main()
{
    int a;
    printf("请输入一个整数: ");
    scanf("%d", &a);//使用scanf函数读取一个整数，并将其存储在变量a中,%d表示输入的整数类型，&a表示变量a的地址
    printf("您输入的整数是: %d\\n", a);
    return 0;
}
        </code></pre></p>
        <p>上面的代码展示了C语言中输入输出函数的使用方法。</p>
        <p>除了上面的%d,还有%f、%c、%s、%lf等格式说明符。%f表示输入的浮点数类型，%c表示输入的字符类型，%s表示输入的字符串类型，%lf表示输入的双精度浮点数类型。</p>
        <p>%5.2f表示输出一个浮点数，总宽度为5个字符，小数部分占2个字符，右对齐。而%-5.2f表示左对齐。</p>
        <p>一般情况下，输入的多个数据之间用空格或换行符分隔。</p>
    `},

        `<p>符号常量是用#define预处理指令定义的常量值。它们在程序中具有固定的值，不能被修改。符号常量通常用于提高代码的可读性和维护性。</p>

        if (!grid) return;
        
        if (filtered.length === 0) {
            grid.innerHTML = `<div class="empty-placeholder"><i class="fas fa-search fa-2x"></i><p>没有找到相关文章 ~</p><small style="color:#6a5e4a;">试试其他关键词吧 ✨</small></div>`;
            return;
        }
        
        // 卡片只显示标题、日期、分类
        grid.innerHTML = filtered.map(article => `
            <div class="article-card" data-id="${article.id}">
                <div class="card-header">
                    <span class="category-badge">${getCategoryIcon(article.category)} ${article.category}</span>
                    <span class="date-tag"><i class="far fa-calendar-alt"></i> ${article.date}</span>
                </div>
                <div class="article-title">📘 ${escapeHtml(article.title)}</div>
                <div class="read-hint">
                    <i class="fas fa-arrow-right"></i> 点击阅读全文
                </div>
            </div>
        `).join('');
        
        // 绑定点击事件
        document.querySelectorAll('.article-card').forEach(card => {
            card.addEventListener('click', () => {
                const id = card.getAttribute('data-id');
                const article = unifiedArticles.find(a => a.id === id);
                if (article) {
                    document.getElementById('readerTitle').innerHTML = `${getCategoryIcon(article.category)} ${article.title}`;
                    document.getElementById('readerBody').innerHTML = `
                        <div style="margin-bottom:1rem; color:#ffcd94;">
                            <i class="far fa-calendar"></i> ${article.date} &nbsp;|&nbsp;
                            <i class="fas fa-tag"></i> ${article.category}
                        </div>
                        ${article.fullContent}
                    `;
                    // 高亮模态框中的代码
                    setTimeout(() => {
                        document.querySelectorAll('#readerBody pre code').forEach(block => hljs.highlightElement(block));
                    }, 10);
                    document.getElementById('articleReaderModal').style.display = 'flex';
                }
            });
        });
    }

    // ==================== 页面切换 ====================
    const homeScreen = document.getElementById('homeScreen');
    const pages = { 
        articles: document.getElementById('articlesPage'), 
        about: document.getElementById('aboutPage'), 
        friends: document.getElementById('friendsPage') 
    };
    
    function showHome() { 
        homeScreen.style.display = 'flex'; 
        Object.values(pages).forEach(p => p.classList.remove('active-page')); 
        if(!hasLoadedOnce) setProgressFull(); 
        updateProgressUI(100); 
        welcomeDiv.classList.add('show'); 
    }
    
    function showPage(pageId) { 
        homeScreen.style.display = 'none'; 
        Object.values(pages).forEach(p => p.classList.remove('active-page')); 
        if(pages[pageId]) pages[pageId].classList.add('active-page'); 
        if(pageId === 'friends') renderFriendsListSub(); 
        if(pageId === 'articles') renderUnifiedArticles(); 
    }
    
    document.querySelectorAll('.blog-entry-btn').forEach(btn => { 
        btn.addEventListener('click', () => { 
            const nav = btn.getAttribute('data-nav'); 
            showPage(nav); 
        }); 
    });
    
    document.querySelectorAll('[data-backhome]').forEach(btn => { 
        btn.addEventListener('click', () => { showHome(); }); 
    });

    // ==================== 模态框事件 ====================
    const addModal = document.getElementById('addFriendModal');
    const openBtn = document.getElementById('openAddModalBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const confirmBtn = document.getElementById('confirmAddFriendBtn');
    
    if(openBtn) openBtn.onclick = () => addModal.style.display = 'flex';
    if(closeModalBtn) closeModalBtn.onclick = () => addModal.style.display = 'none';
    if(confirmBtn) confirmBtn.onclick = async () => {
        let name = document.getElementById('modalFriendName').value;
        let url = document.getElementById('modalFriendUrl').value;
        if(await addFriendWithVerify(name, url)) {
            addModal.style.display = 'none';
            document.getElementById('modalFriendName').value = '';
            document.getElementById('modalFriendUrl').value = '';
            if(pages.friends.classList.contains('active-page')) renderFriendsListSub(document.getElementById('friendSearchInput')?.value || '');
        }
    };
    addModal.addEventListener('click', (e) => { if(e.target === addModal) addModal.style.display = 'none'; });
    
    const closeReaderBtn = document.getElementById('closeReaderBtn');
    const readerModal = document.getElementById('articleReaderModal');
    if(closeReaderBtn) closeReaderBtn.onclick = () => readerModal.style.display = 'none';
    if(readerModal) readerModal.addEventListener('click', (e) => { if(e.target === readerModal) readerModal.style.display = 'none'; });
    
    if(document.getElementById('friendSearchInput')) {
        document.getElementById('friendSearchInput').addEventListener('input', (e) => renderFriendsListSub(e.target.value));
    }
    
    // 文章筛选事件
    if(document.getElementById('articleSearchInput')) {
        document.getElementById('articleSearchInput').addEventListener('input', renderUnifiedArticles);
        document.getElementById('clearSearchBtn').addEventListener('click', () => {
            document.getElementById('articleSearchInput').value = '';
            renderUnifiedArticles();
        });
        document.getElementById('articleCategorySelect').addEventListener('change', renderUnifiedArticles);
    }

    // 启动
    loadFriends();
    startFirstLoadAnimation();
    showHome();
</script>
</body>
</html>
