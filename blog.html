<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>QiHua·blog</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Highlight.js 语法高亮库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/java.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 全局滚动条样式 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0a1018;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a3a4a;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3e5568;
        }
        * {
            scrollbar-width: thin;
            scrollbar-color: #2a3a4a #0a1018;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #03050b;
            min-height: 100vh;
            overflow-x: hidden;
            color: #f0ede2;
        }

        #starsCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: radial-gradient(ellipse at center, #0a0f1f 0%, #020408 100%);
            display: block;
        }

        .home-wrapper {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem 2rem 8rem;
        }

        .welcome-core {
            text-align: center;
            opacity: 0;
            transform: scale(0.9) translateY(20px);
            transition: opacity 0.9s cubic-bezier(0.2, 0.9, 0.4, 1.1), transform 0.8s ease;
            backdrop-filter: blur(2px);
            background: rgba(5, 10, 20, 0.3);
            padding: 2rem 3rem;
            border-radius: 80px;
            border: 1px solid rgba(255,215,150,0.2);
            box-shadow: 0 0 60px rgba(0,20,40,0.6);
        }

        .welcome-core.show {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
        }

        .greeting-text {
            font-family: 'Merriweather', serif;
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #FEE140, #FA709A, #FFDEE9, #B4F0FF);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 0 30px rgba(255,200,100,0.6);
            margin-bottom: 2rem;
            letter-spacing: 2px;
        }

        .nav-options {
            display: flex;
            justify-content: center;
            gap: 2rem;
            flex-wrap: wrap;
        }

        .blog-entry-btn {
            background: rgba(15, 25, 45, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 200, 120, 0.6);
            border-radius: 60px;
            padding: 12px 36px;
            font-size: 1.2rem;
            font-weight: 600;
            color: #ffefdb;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            letter-spacing: 1px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        .blog-entry-btn:hover {
            transform: translateY(-6px);
            background: rgba(45, 70, 110, 0.8);
            border-color: #ffdd99;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
            color: white;
        }

        .progress-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 20;
            padding: 1.5rem 2rem 2rem;
            background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
            backdrop-filter: blur(6px);
        }

        .progress-container {
            width: 80%;
            max-width: 1000px;
            margin: 0 auto;
            position: relative;
        }

        .progress-track {
            background: rgba(30, 40, 60, 0.5);
            border-radius: 60px;
            height: 10px;
            position: relative;
            overflow: hidden;
        }

        .progress-fill {
            position: absolute;
            top: 0;
            left: 0;
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #3a7bd5, #00d2ff, #6ee7ff);
            border-radius: 60px;
            transition: width 0.06s linear;
        }

        .progress-glow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 0%;
            height: 280%;
            background: radial-gradient(circle, rgba(70,180,255,0.8) 0%, rgba(30,100,200,0) 85%);
            filter: blur(12px);
            transition: width 0.08s ease, left 0.08s ease;
        }

        .loading-hint {
            text-align: center;
            margin-top: 12px;
            font-size: 0.75rem;
            color: #aab3c2;
            letter-spacing: 1px;
        }

        /* 文章页面 */
        .blog-subpage {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 7, 18, 0.96);
            backdrop-filter: blur(4px);
            z-index: 200;
            overflow-y: auto;
            padding: 2rem 2rem 3rem;
            display: none;
            color: #e6e2db;
        }
        
        .blog-subpage::-webkit-scrollbar {
            width: 8px;
        }
        .blog-subpage::-webkit-scrollbar-track {
            background: #0a1018;
            border-radius: 10px;
        }
        .blog-subpage::-webkit-scrollbar-thumb {
            background: #2a3a4a;
            border-radius: 10px;
        }
        
        .blog-subpage.active-page {
            display: block;
        }
        
        .subpage-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid #2e3f55;
            padding-bottom: 1rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        
        .back-home-btn {
            background: #1f2a36;
            border: none;
            padding: 8px 24px;
            border-radius: 40px;
            color: #ffdaaa;
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
        }
        
        .back-home-btn:hover {
            background: #3e4e62;
        }
        
        .subpage-title {
            font-size: 2rem;
            font-family: 'Merriweather', serif;
            background: linear-gradient(120deg, #f9d976, #f39f86);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        /* 筛选栏 */
        .filter-bar {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
        }
        
        .search-box {
            flex: 1;
            min-width: 200px;
            display: flex;
            gap: 10px;
        }
        
        .search-box input {
            flex: 1;
            background: #1a2532;
            border: 1px solid #ffcd9455;
            border-radius: 60px;
            padding: 12px 18px;
            color: #e9f0e8;
            font-size: 0.9rem;
        }
        
        .search-box input::placeholder {
            color: #8a7e68;
        }
        
        .search-box input:focus {
            outline: none;
            border-color: #00d2ff;
            box-shadow: 0 0 8px rgba(0,210,255,0.3);
        }
        
        .search-box button, .category-select {
            background: #1a2532;
            border: 1px solid #ffcd9455;
            border-radius: 60px;
            padding: 0 20px;
            color: #ffefdb;
            cursor: pointer;
            transition: 0.2s;
        }
        
        .search-box button:hover {
            background: #2a3a4a;
            border-color: #00d2ff;
        }
        
        .category-select select {
            background: #1a2532;
            border: none;
            color: #ffefdb;
            padding: 12px 8px;
            cursor: pointer;
            outline: none;
        }

        /* 文章卡片 - 无代码预览 */
        .articles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
            margin-top: 0.5rem;
        }
        
        .article-card {
            background: #111a24cc;
            backdrop-filter: blur(8px);
            border-radius: 28px;
            border: 1px solid rgba(255, 200, 150, 0.3);
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .article-card:hover {
            transform: translateY(-5px);
            border-color: #ffbc6e;
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
        }
        
        .card-header {
            padding: 1rem 1.2rem 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,200,150,0.2);
        }
        
        .category-badge {
            background: rgba(255,200,120,0.2);
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #ffd7a0;
        }
        
        .date-tag {
            font-size: 0.7rem;
            color: #9a8e72;
        }
        
        .article-title {
            font-size: 1.2rem;
            font-weight: 600;
            padding: 1rem 1.2rem;
            color: #ffefdb;
            line-height: 1.4;
        }
        
        /* 文章卡片底部提示 */
        .read-hint {
            padding: 0.8rem 1.2rem 1rem;
            font-size: 0.7rem;
            color: #7d6e55;
            border-top: 1px solid rgba(255,200,150,0.1);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .read-hint i {
            font-size: 0.7rem;
        }
        
        .empty-placeholder {
            text-align: center;
            padding: 4rem;
            background: rgba(20,30,45,0.5);
            border-radius: 48px;
            color: #9a8e72;
        }

        /* 友圈样式 */
        .friend-list-sub {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px,1fr));
            gap: 1.2rem;
            margin-top: 1.5rem;
        }
        
        .friend-item-sub {
            background: #0f1822cc;
            backdrop-filter: blur(8px);
            border-radius: 32px;
            padding: 1rem 1.2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            border: 1px solid #3f5568;
            transition: 0.2s;
        }
        
        .friend-item-sub:hover {
            border-color: #ffbc6e;
            transform: translateY(-2px);
        }
        
        .friend-avatar-blog {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #c9ae86, #a0815a);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            flex-shrink: 0;
            color: #1a1a2e;
        }
        
        .friend-info-blog {
            flex: 1;
            overflow: hidden;
        }
        
        .friend-name-blog {
            font-weight: 600;
        }
        
        .friend-url-blog {
            font-size: 0.7rem;
            color: #bcb0a0;
            text-overflow: ellipsis;
            overflow: hidden;
            white-space: nowrap;
        }
        
        .friend-url-blog a {
            color: #bcb0a0;
            text-decoration: none;
        }
        
        .friend-url-blog a:hover {
            color: #ffbc6e;
        }
        
        .search-friend-area {
            display: flex;
            gap: 12px;
            margin-bottom: 1.8rem;
            flex-wrap: wrap;
        }
        
        .search-input-sub {
            flex: 1;
            padding: 12px 20px;
            border-radius: 60px;
            background: #1a2532;
            border: 1px solid #ffcd9455;
            color: #f0e6d8;
        }
        
        .btn-add-sub {
            background: #c1863e;
            border: none;
            border-radius: 60px;
            padding: 0 24px;
            font-weight: bold;
            cursor: pointer;
            color: #fff1e0;
            transition: 0.2s;
        }
        
        .btn-add-sub:hover {
            background: #d49a52;
            transform: translateY(-2px);
        }
        
        .about-card-sub {
            background: #0e1722cc;
            backdrop-filter: blur(8px);
            border-radius: 48px;
            padding: 2rem;
            text-align: center;
            border: 1px solid #ffcd94;
        }

        /* 模态框 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal-card {
            background: #1b232f;
            border-radius: 36px;
            width: 90%;
            max-width: 850px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            border: 1px solid #ffddb0;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 1.5rem;
            border-bottom: 1px solid #ffcd94;
        }
        
        .modal-close-btn {
            background: none;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            color: #ffbc6e;
            transition: 0.2s;
        }
        
        .modal-close-btn:hover {
            color: #ffdd99;
            transform: scale(1.1);
        }
        
        .modal-body-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
        }
        
        .modal-body-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .modal-body-scroll::-webkit-scrollbar-track {
            background: #0a1018;
            border-radius: 10px;
        }
        .modal-body-scroll::-webkit-scrollbar-thumb {
            background: #2a3a4a;
            border-radius: 10px;
        }
        
        .modal-body-scroll pre {
            background: #0a0e16;
            border-radius: 16px;
            padding: 1rem;
            overflow-x: auto;
            margin: 1rem 0;
        }
        
        .modal-body-scroll pre code {
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
        }
        
        u, .u {
            text-decoration: underline;
            text-decoration-skip-ink: none;
        }

        @media (max-width: 680px) {
            .greeting-text { font-size: 1.8rem; }
            .blog-entry-btn { padding: 8px 18px; font-size: 1rem; }
            .articles-grid { grid-template-columns: 1fr; }
            .filter-bar { flex-direction: column; align-items: stretch; }
            .welcome-core { padding: 1rem 1.5rem; }
            .subpage-title { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

<canvas id="starsCanvas"></canvas>

<div class="home-wrapper" id="homeScreen">
    <div class="welcome-core" id="welcomeCore">
        <div class="greeting-text">✨ 欢迎来到我的博客 ✨</div>
        <div class="nav-options">
            <div class="blog-entry-btn" data-nav="articles"><i class="fas fa-book-open"></i> 文章</div>
            <div class="blog-entry-btn" data-nav="about"><i class="fas fa-user-astronaut"></i> 关于</div>
            <div class="blog-entry-btn" data-nav="friends"><i class="fas fa-user-friends"></i> 友圈</div>
        </div>
    </div>
</div>

<div class="progress-footer">
    <div class="progress-container">
        <div class="progress-track">
            <div class="progress-fill" id="progressFill"></div>
            <div class="progress-glow" id="progressGlow"></div>
        </div>
        <div class="loading-hint" id="loadingHint">✦ 星辰汇聚 · 开启墨言 ✦</div>
    </div>
</div>

<!-- 文章页面 -->
<div id="articlesPage" class="blog-subpage">
    <div class="subpage-header">
        <h2 class="subpage-title"><i class="fas fa-feather-alt"></i> 文章</h2>
        <button class="back-home-btn" data-backhome>⌂ 返回首页</button>
    </div>
    
    <div class="filter-bar">
        <div class="search-box">
            <input type="text" id="articleSearchInput" placeholder="🔍 搜索文章标题或内容...">
            <button id="clearSearchBtn"><i class="fas fa-eraser"></i> 清空</button>
        </div>
        <div class="category-select">
            <select id="articleCategorySelect">
                <option value="all">📚 全部内容</option>
                <option value="Java">☕ Java </option>
                <option value="C++">🔄 C++ </option>
                <option value="C">⚙️ C语言 </option>
                <option value="Python">🐍 Python </option>
                <option value="数据结构">🌲 数据结构 </option>
                <option value="MySQL">🗄️ MySQL </option>
            </select>
        </div>
    </div>
    
    <div id="articlesGrid" class="articles-grid"></div>
</div>

<!-- 关于页面 -->
<div id="aboutPage" class="blog-subpage">
    <div class="subpage-header"><h2 class="subpage-title"><i class="fas fa-user"></i> 关于我</h2><button class="back-home-btn" data-backhome>⌂ 返回首页</button></div>
    <div class="about-card-sub">
        <i class="fas fa-feather-alt" style="font-size: 3rem; margin-bottom: 1rem;"></i>
        <h2>祁画</h2>
        <p style="margin: 1rem 0;">游戏热爱者 · 摄影爱好者 · 代码诗人</p>
        <p>你好，我是祁画，一个喜欢看世界和镜头记录风景的00后。相信世间万物皆有故事，希望通过这个博客平台，与同样热爱生活与思考的你相遇。</p>
        <p style="margin-top: 1rem;">如果你也喜欢游戏、摄影或者只是聊聊日常，欢迎在友圈留下足迹。</p>
    </div>
</div>

<!-- 友圈页面 -->
<div id="friendsPage" class="blog-subpage">
    <div class="subpage-header"><h2 class="subpage-title"><i class="fas fa-user-friends"></i> 挚友</h2><button class="back-home-btn" data-backhome>⌂ 返回首页</button></div>
    <div class="search-friend-area">
        <input type="text" id="friendSearchInput" class="search-input-sub" placeholder="🔍 搜索好友...">
        <button id="openAddModalBtn" class="btn-add-sub"><i class="fas fa-plus"></i> 加好友</button>
    </div>
    <div id="friendsListRenderSub" class="friend-list-sub"></div>
</div>

<!-- 添加好友模态框 -->
<div id="addFriendModal" class="modal-overlay">
    <div class="modal-card" style="max-width:500px;">
        <div class="modal-header"><h3><i class="fas fa-globe"></i> 添加好友</h3><button class="modal-close-btn" id="closeModalBtn">&times;</button></div>
        <div class="modal-body-scroll">
            <input type="text" id="modalFriendName" placeholder="好友昵称" style="width:100%; margin-bottom:12px; padding:10px; border-radius:30px; background:#2c3a46; border:1px solid #ffcd9455; color:white;">
            <input type="url" id="modalFriendUrl" placeholder="博客网址" style="width:100%; margin-bottom:12px; padding:10px; border-radius:30px; background:#2c3a46; border:1px solid #ffcd9455; color:white;">
            <button class="confirm" id="confirmAddFriendBtn" style="background:#e6b56e; border:none; padding:10px; border-radius:40px; font-weight:bold; cursor:pointer;">验证并添加</button>
            <div style="font-size:0.7rem; color:#bfb28b; margin-top:8px;">* 网址需要可访问才能添加</div>
        </div>
    </div>
</div>

<!-- 文章阅读模态框 -->
<div id="articleReaderModal" class="modal-overlay">
    <div class="modal-card">
        <div class="modal-header"><h3 id="readerTitle"></h3><button class="modal-close-btn" id="closeReaderBtn">&times;</button></div>
        <div class="modal-body-scroll" id="readerBody"></div>
    </div>
</div>

<script>
    // ==================== 星空特效 ====================
    const canvas = document.getElementById('starsCanvas');
    let ctx = canvas.getContext('2d');
    let width, height;
    let stars = [];
    const STAR_COUNT = 280;
    
    function resizeCanvas() { 
        width = window.innerWidth; 
        height = window.innerHeight; 
        canvas.width = width; 
        canvas.height = height; 
    }
    
    class Star { 
        constructor() { 
            this.x = Math.random() * width; 
            this.y = Math.random() * height; 
            this.radius = Math.random() * 2.2 + 0.8; 
            this.alpha = Math.random() * 0.5 + 0.3; 
            this.twinkleSpeed = 0.005 + Math.random() * 0.015; 
            this.twinkleDir = Math.random() > 0.5 ? 1 : -1; 
        } 
        update() { 
            this.alpha += this.twinkleSpeed * this.twinkleDir; 
            if(this.alpha > 0.9) { this.alpha = 0.9; this.twinkleDir = -1; } 
            if(this.alpha < 0.2) { this.alpha = 0.2; this.twinkleDir = 1; } 
        } 
        draw() { 
            ctx.beginPath(); 
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); 
            ctx.fillStyle = `rgba(255, 235, 190, ${this.alpha})`; 
            ctx.fill(); 
            ctx.shadowBlur = 4; 
            ctx.shadowColor = "#fffbd0"; 
        } 
    }
    
    function initStars() { 
        stars = []; 
        for(let i=0; i<STAR_COUNT; i++) stars.push(new Star()); 
    }
    
    function animateStars() { 
        if(!ctx) return; 
        ctx.clearRect(0, 0, width, height); 
        ctx.fillStyle = "#03050b"; 
        ctx.fillRect(0,0,width,height); 
        for(let s of stars) { s.update(); s.draw(); } 
        requestAnimationFrame(animateStars); 
    }

    const progressFill = document.getElementById('progressFill'), glowEl = document.getElementById('progressGlow'), welcomeDiv = document.getElementById('welcomeCore'), loadingHint = document.getElementById('loadingHint');
    
    function updateProgressUI(value) { 
        const percent = Math.min(100, Math.max(0, value)); 
        if(progressFill) progressFill.style.width = percent + '%'; 
        if(glowEl) { glowEl.style.left = percent + '%'; glowEl.style.width = '18%'; } 
        if(percent >= 100 && welcomeDiv && !welcomeDiv.classList.contains('show')) { 
            welcomeDiv.classList.add('show'); 
            if(loadingHint) loadingHint.innerText = "✦ 星门已开 · 静候君选 ✦"; 
            hasLoadedOnce = true; 
            if(progressAnimationId) cancelAnimationFrame(progressAnimationId); 
        } else if(loadingHint && percent < 100) loadingHint.innerText = `✦ 星辰汇聚 ${Math.floor(percent)}% · 即将开启 ✦`; 
    }
    
    function startFirstLoadAnimation() { 
        let startTime = null; 
        const duration = 5000; 
        function step(timestamp) { 
            if(!startTime) startTime = timestamp; 
            const elapsed = timestamp - startTime; 
            let p = Math.min(100, (elapsed / duration) * 100); 
            currentProgress = p; 
            updateProgressUI(currentProgress); 
            if(currentProgress < 100) progressAnimationId = requestAnimationFrame(step); 
            else progressAnimationId = null; 
        } 
        progressAnimationId = requestAnimationFrame(step); 
    }
    
    function setProgressFull() {
        if(progressAnimationId) cancelAnimationFrame(progressAnimationId);
        currentProgress = 100;
        updateProgressUI(100);
        if(welcomeDiv) welcomeDiv.classList.add('show');

    async function isUrlAccessible(url) {

            return true; 
        } catch(e) { 
            return new Promise((resolve) => { 
                const img = new Image(); 
                img.onload = () => resolve(true); 
                img.onerror = () => resolve(false); 
                img.src = url; 
                setTimeout(() => resolve(false), 4000);

        } 
    }
    
    async function addFriendWithVerify(name, blogUrl) { 
        const trimmedName = name.trim(); 
        if(!trimmedName) { showToast("昵称不能为空"); return false; } 
        if(!blogUrl.trim()) { showToast("请输入网址"); return false; } 
        let validUrl = blogUrl.trim(); 
        if(!validUrl.startsWith('http://') && !validUrl.startsWith('https://')) validUrl = 'https://' + validUrl; 
        try { new URL(validUrl); } catch(e) { showToast("网址格式不正确"); return false; } 
        showToast("验证中..."); 
        const accessible = await isUrlAccessible(validUrl); 
        if(!accessible) { showToast("❌ 网址无法访问"); return false; } 
        if(friendsList.some(f => f.blogUrl === validUrl || f.name === trimmedName)) { showToast("好友已存在"); return false; } 
        friendsList.push({ id: Date.now() + '-' + Math.random().toString(36).substr(2,6), name: trimmedName, blogUrl: validUrl });

            if(m==='&') return '&amp;';

            if(m==='>') return '&gt;';

        });

        fullContent:
        `<p><strong>和C语言中的一样，理解的可以直接下一篇</strong></p>
        <p>选择结构是指根据条件的不同执行不同的代码块。在Java中，常用的选择结构包括if语句、switch语句等。例如：</p>
        <p><pre><code class = 'language-java'>
import java.util.Scanner;
public class IF
{
    public static void main(String args[])
    {
        Scanner reader = new Scanner(System.in);
        int a = reader.nextInt();

        if(a < 0)
            System.out.println("负数");
        else if(a == 0)
            System.out.println("0");
        else
            System.out.println("正数");

        reader.close();
    }
}
        </code></pre></p>
        <p>在这个例子中，我们使用了if语句来判断一个整数是否为正数、负数或零，并输出相应的结果。</p>
        <p>还有switch的选择结构，一般配合着break来使用。</p>
        <p><pre><code class = 'language-java'>import java.util.Scanner;
public class SWITCH
{
    public static void main(String args[])
    {
        Scanner reader = new Scanner(System.in);
        int a = reader.nextInt();

        switch(a)
        {
            case 1:
                System.out.println("1");
                break;
            case 2:
                System.out.println("2");
                break;
            default:
                System.out.println("default");
                break;
        }

        reader.close();
    }
}
        </code></pre></p>
        <p>循环结构是指重复执行某段代码块，直到满足特定条件为止。在Java中，常用的循环结构包括for循环、while循环、do-while循环等。例如：</p>
        <p><pre><code class = 'language-java'>
public class FOE
{
    public static void main(String args[])
    {
        int sum = 0;

        for(int i = 0;i <= 10;i++)
        {
            sum += i;
        }

        System.out.println(sum);
    }
}
        </code></pre></p>
        <p>在这个例子中，我们使用了for循环来计算1到10之间所有整数的和，并将结果存储在变量sum中。for适合知道循环次数，while适合未知次数，do-while和while差不多，但是do-while先使用再判断条件是否符合，while是先判断是否符合条件再使用</p>
        <p>接下来是break和continue这两个关键字了。</p>
        <p>break是跳出循环，即下面有语句也不执行，直接跳出，终止循环。continue是跳过这次循环，继续下一次循环，即不会像break那样直接终止循环，而是跳过这一次去执行下一次。</p>
        <p>看下面这个例子：</p>
        <p><pre><code class = 'language-java'>
public class FOR1
{
    public static void main(String args[])
    {
        for(int i = 0;i <= 10;i++)
        {
            if(i == 6)
                break;

            System.out.printf("%d ",i);//输出0 1 2 3 4 5
        }
        System.out.printf("\n");

        for(int j = 0;j <= 10;j++)
        {
            if(j == 6)
                continue;

            System.out.printf("%d ",j);//输出0 1 2 3 4 5 7 8 9 10
        }
    }
}
        </code></pre></p>`

        for(int i = 0;i < a.length;i++)
        {
            System.out.printf("%d ",a[i]);
        }

        System.out.printf("\n");

        for(int i = 0;i < b.length;i++)
        {
            System.out.printf("%c ",b[i]);
        }

        System.out.printf("\n");


        for(int i:a)
        {
            System.out.printf("%d ",i);
        }

        System.out.printf("\n");

        for(char ch:b)
        {
            System.out.printf("%c ",ch);
        }
    }
}
        </code></pre></p>

        `<p>类体中包括成员变量的声明和方法的定义。成员变量又分为实例变量和类变量两种。实例变量是指在类中声明的变量，但没有使用static修饰符修饰，这些变量属于对象，每个对象都有自己的一份实例变量。当我们创建一个对象时，系统会为该对象分配一块内存来存储它的实例变量。我们可以通过对象来访问和修改它的实例变量。例如：</p>
        <p><pre><code class = 'language-java'>
class Person
{
    String name;
}

public class ShiLiBianLiang
{
    public static void main(String args[])
    {
        Person person = new Person();
        person.name = "Tom";
        System.out.println(person.name);
    }
}
        </code></pre></p>
        <p>在这个例子中，我们定义了一个名为Person的类，其中包含一个实例变量name。当我们创建一个Person对象时，我们可以通过该对象来访问和修改name变量。</p>
        <p>类变量是指在类中声明的变量，并且使用static修饰符修饰，这些变量属于类本身，而不是某个特定的对象。所有对象共享同一份类变量。当我们修改一个类变量时，所有对象都会受到影响。例如：</p>
        <p><pre><code class = 'language-java'>
class Counter
{
    static int count;
}

public class LeiBianLiang
{
    public static void main(String args[])
    {
        Counter counter1 = new Counter();
        Counter counter2 = new Counter();
        counter1.count = 2;
        counter2.count = 3;
        System.out.println(counter1.count);//3
        System.out.println(counter2.count);//3
        //公用一个count,所以输出都为3
    }
}
        </code></pre></p>
        <p>在这个例子中，我们定义了一个名为Counter的类，其中包含一个类变量count。当我们创建多个Counter对象时，它们共享同一份count变量，当我们修改count时，所有Counter对象都会受到影响。</p>
        <p>实例变量属于对象，每个对象都有自己的一份，而类变量属于类本身，所有对象共享同一份。这是Java中成员变量的重要概念，对于理解面向对象编程非常重要。</p>

        `<blockquote><p>方法重载是指在同一个类中定义多个方法，这些方法具有相同的名称但参数列表不同。方法重载允许我们使用相同的方法名来处理不同类型或数量的参数，从而提高代码的可读性和灵活性。</p></blockquote>
        <p>方法重载的规则如下：</p>
        <p><ul style='padding-left:1em'>
            <li>方法名必须相同。</li>
            <li>参数列表必须不同，可以是参数的类型不同、参数的数量不同或两者都不同。</li>
            <li>方法的返回类型可以相同也可以不同，但仅凭返回类型的不同不能构成方法重载。</li>
        </ul></p>
        <p>例如：</p>
        <p><pre><code class = 'language-java'>
public class MethodRechange
{
    public int add(int a,int b)
    {
        return a+b;
    }

    public int add(int a,int b,int c)
    {
        return a+b+c;
    }

    public double add(double a,double b)
    {
        return a+b;
    }

    public static void main(String args[])
    {
        MethodRechange sum = new MethodRechange();
        System.out.println(sum.add(1,46));
        System.out.println(sum.add(3.14,5.26));
        System.out.println(sum.add(2,65,13));
    }
}
        </code></pre></p>
        <p>在这个例子中，我们定义了三个名为add的方法，它们具有不同的参数列表。第一个add方法接受两个整数参数并返回它们的和，第二个add方法接受三个整数参数并返回它们的和，第三个add方法接受两个double类型的参数并返回它们的和。当我们调用add方法时，Java编译器会根据传递的参数类型和数量来确定调用哪个版本的方法。</p>
        <p>方法重载是Java中一种重要的特性，它允许我们在同一个类中定义多个具有相同名称但参数列表不同的方法，从而提高代码的可读性和灵活性。</p>

        fullContent:
        `<p>import语句用于在Java程序中引入其他类或包，以便在当前类中使用它们的功能。通过import语句，我们可以避免在代码中使用类的全限定名，从而使代码更简洁和易读。import语句通常放在Java源文件的开头，在package声明之后，类定义之前。</p>
        <p>Java提供了两种类型的import语句：</p>
        <p><ul style='padding-left:1em'>
            <li>单个类导入：使用import语句导入特定的类。例如：<code>import java.util.ArrayList;</code> 这将导入java.util包中的ArrayList类，使我们可以直接使用ArrayList而无需指定完整路径。</li>
            <li>通配符导入：使用星号（*）作为通配符来导入一个包中的所有类。例如：<code>import java.util.*;</code> 这将导入java.util包中的所有类，使我们可以直接使用该包中的任何类。</li>
        </ul></p>
        <p>需要注意的是，import语句仅仅是为了方便我们在代码中引用其他类，并不会增加程序的性能开销。Java编译器会根据需要自动处理导入的类，无论是单个类还是整个包。</p>
        <p>总之，import语句是Java中用于引入其他类或包的重要工具，它使得我们的代码更加简洁和易读，同时也提供了灵活性来选择性地导入所需的类。</p>
        <p>举例：</p>
        <p><pre><code class = 'language-java'>
import java.util.*;
public class test
{
    public static void main(String args[])
    {
        Scanner scanner = new Scanner(System.in);
        int age = scanner.nextInt();
        System.out.println("age:" + age);
        scanner.close();
    }
}
        </code></pre></p>
        <p>上面代码展示了import语句的使用方法。最开始先用import java.util.*;导入所有包，然后Scanner scanner = new Scanner();创建一个Scanner对象,再定义age变量，用来接收scanner调用nextInt()方法的值，即键盘输入的值。最后scanner调用close()方法关闭输入。（可关可不关，但是最好还是关闭吧）</p>
        <p><ul style='padding-left:1em'>
            <li>整型：nextInt()，nextLong()，nextShort()</li>
            <li>浮点型：nextDouble(),nextFloat()</li>
            <li>一个字符串：next()</li>
            <li>整行字符串：nextLine()</li>
            <li>charAt(索引)：表示取字符串的第1个字符（索引从0开始）</li>
            <li>混用：next().charAt(索引)和nextLine().charAt(索引)</li>
            <li>字节型：nextByte()</li>
            <li>布尔型：nextBoolean()</li>
        </ul></p>
        <p>nextLine() 会读取换行符，如果前面用了 nextInt() 或 next()，会导致 nextLine() 直接读到空字符串</p>

        language:"java",
        fullContent:
        `<p>包（Package）是Java中用于组织类和接口的一种机制。它提供了一种命名空间，帮助开发者更好地管理和组织代码。通过使用包，我们可以避免类名冲突，并且可以更方便地进行访问控制和代码维护。</p>
        <p>在Java中，包的定义使用package关键字，通常放在Java源文件的开头。例如：<code>package com.example.myapp;</code> 这将定义一个名为com.example.myapp的包。我们可以在这个包中创建多个类和接口，这些类和接口就属于这个包的一部分。</p>
        <p>使用包的好处包括：</p>
        <p><ul style='padding-left:1em'>
            <li>避免命名冲突：不同的开发者或团队可能会创建具有相同名称的类，通过使用包可以将它们区分开来，避免命名冲突。</li>
            <li>访问控制：包还提供了访问控制机制，可以通过访问修饰符（如public、protected、private）来控制类和成员的可见性。</li>
            <li>代码组织：包有助于将相关的类和接口组织在一起，使得代码结构更加清晰和易于维护。</li>
        </ul></p>
        <p>总之，包是Java中用于组织类和接口的重要机制，它提供了命名空间、访问控制和代码组织等功能，是Java编程中不可或缺的一部分。</p>
        <p><strong>其实，在文件层面就是新建了一个文件夹，然后把类文件放在里面。</strong></p>`
    },

        title:"Java中的访问修饰符",

        fullContent:
        `<p>访问修饰符是Java中用于控制类、方法和变量访问权限的关键字。Java提供了四种访问修饰符：public、protected、private和默认（不使用修饰符）。通过使用访问修饰符，我们可以控制哪些类或成员可以被其他类访问，从而实现封装和信息隐藏。</p>
        <p>以下是四种访问修饰符的详细说明：</p>
        <p><ul style='padding-left:1em'>
            <li><strong>public</strong>: 使用public修饰的类、方法或变量可以被任何其他类访问，无论它们是否在同一个包中。这是最开放的访问级别。</li>
            <li><strong>protected</strong>: 使用protected修饰的成员可以被同一个包中的其他类访问，以及任何子类（即使子类在不同的包中）。这提供了一定程度的封装，同时允许继承关系中的访问。</li>
            <li><strong>private</strong>: 使用private修饰的成员只能在定义它们的类内部访问，其他类无法直接访问。这是最严格的访问级别，常用于隐藏实现细节。</li>
            <li><strong>默认（包私有）</strong>: 如果没有指定访问修饰符，则默认为包私有。这意味着该成员只能被同一个包中的其他类访问，但不能被不同包中的类访问。</li>
        </ul></p>
        <p>访问修饰符是Java中用于控制类、方法和变量访问权限的重要工具，通过合理使用它们，我们可以实现良好的封装和信息隐藏，提高代码的安全性和可维护性。</p>

        title:"Java中的this关键字",
        language:"java",
        fullContent:
        `<p>this关键字是Java中一个重要的引用变量，它指向当前对象本身。this关键字主要用于解决变量命名冲突和在构造方法中调用其他构造方法。</p>
        <p>当一个类中有成员变量和局部变量同名时，可以使用this关键字来区分它们。例如：</p>
        <p><pre><code class = 'language-java'>
import java.util.*;
public class test_this
{
    private String name;
    private int age;

    public test_this(String name,int age)
    {
        this.age = age;
        this.name = name;
    }

    public void show()
    {
        System.out.println(name + "," + age);
    }

    public static void main(String args[])
    {
        test_this s1 = new test_this("zhangsan",28);
        test_this s2 = new test_this("wangwu",20);
        
        s1.show();
        s2.show();

        Scanner scanner = new Scanner(System.in);
        String name = scanner.next();
        int age = scanner.nextInt();
        System.out.println(name + "," + age);
        
        scanner.close();
    }
}
        </code></pre>
        <pre><code class = 'language-java'>
public class This1
{
    private String name;
    private int age;

    // 构造方法
    public This1(String name, int age) 
    {
        this.age = age;// 第1空
         this.name = name;// 第2空
    }

    public void setName(String name) 
    {
          this.name = name;// 第3空
    }

    public void introduce() 
    {
        String name = "临时变量";
        System.out.println("我叫" + this.name + "，今年" + this.age + "岁");  // 第4、5空
        // 上面的输出要显示成员变量的值，不能显示局部变量
    }
}
        </code></pre></p>
        <p>如图所示，当局部变量和成员变量同名时，使用this关键字可以明确指定访问的是成员变量。</p>
        <p>此外，this关键字还可以用于在构造方法中调用其他构造方法。例如：</p>
        <p><pre><code class = 'language-java'>
public class This2
{
    private String name;
    private int age;
    private String school;

    //构造方法1，三个参数
    public This2(String name,int age,String school)
    {
        this.name = name;
        this.age = age;
        this.school = school;
    }

    //构造方法2，两个参数，一个未知
    public This2(String name,int age)
    {
        this(name,age,"未知");
    }

    //构造方法3，一个参数，两个未知
    public This2(String name)
    {
        this(name,0);
    }

    public static void main(String args[])
    {
        This2 s1 = new This2("zhangsan",13,"11555");
        This2 s2 = new This2("wangwu",13);
        This2 s3 = new This2("lisi");

        System.out.println(s1.name + " " +s1.school + " " + s1.age);
        System.out.println(s2.name + " " +s2.school + " " + s2.age);
        System.out.println(s3.name + " " +s3.school + " " + s3.age);
    }
}
        </code></pre></p>
        <p>由代码：通过使用this()调用其他构造方法，可以避免代码重复。</p>
        <p><strong>注意：this只能在实例方法或构造方法中使用，并且只能在第一行，所以使用时要考虑super()等其他需要在第一行使用的关键字；还不能出现循环调用的情况(A调用B，B调用A)。</strong></p>

        title:"Java中基本类型的类封装（包装类）",
        language:"java",        
        fullContent:
        `<p>Java中的基本类型（如int、double、boolean等）是原始数据类型，它们不是对象，因此没有方法可以调用。为了在需要对象的情况下使用基本类型，Java提供了包装类（Wrapper Classes），每个基本类型都有一个对应的包装类。例如：Integer对应int，Double对应double，Boolean对应boolean等。</p>
        <p>包装类提供了一些有用的方法来操作基本类型的值，例如：</p>
        <p><pre><code class = 'language-java'>
public class WrapperSimpleExample
{
    public static void main(String args[])
    {
        String str = "123";
        int num = Integer.parseInt(str);
        System.out.println("字符转数字：" + num);

        int num1 = 123456;
        String str1 = Integer.toString(num1);
        System.out.println("数字转字符：" + str1);

        Integer a = 10;
        Integer b = 20;
        int result = a.compareTo(b);
        System.out.println("a,b的大小：" + result);
    }
}
        </code></pre></p>
        <p>在这个例子中，我们使用了Integer类的静态方法parseInt()将字符串转换为整数，并使用toString()方法将整数转换为字符串。此外，包装类还提供了其他方法，如valueOf()、compareTo()等，可以方便地进行类型转换和比较操作。</p>
        <p>总之，包装类是Java中用于封装基本类型的对象，它们提供了丰富的方法来操作基本类型的值，使得我们在需要对象的情况下能够方便地使用基本类型。</p>`

        title:"Java中的var关键字和类型推断",
        language:"java",    
        fullContent:
        `<p>var关键字是Java 10引入的一种局部变量类型推断机制，它允许开发者在声明局部变量时省略类型，编译器会根据变量的初始化表达式自动推断出变量的类型。使用var关键字可以使代码更简洁和易读，尤其是在声明复杂类型的变量时。</p>
        <p>使用var关键字的语法如下：</p>
        <p><code>var variableName = initializationExpression;</code></p>
        <p>例如：</p>
        <p><pre><code class = 'language-java'>
public class Var
{
    public static void main(String args[])
    {
        var message = "Hello,World!";
        System.out.println(message);
    }
}
        </code></pre></p>
        <p>在这个例子中，我们使用var关键字声明了一个字符串变量message，并将其初始化为'Hello, World!'。编译器会自动推断出message的类型为String。</p>
        <p>需要注意的是，var关键字只能用于局部变量的声明，不能用于成员变量、方法参数或返回类型。此外，使用var时必须同时进行初始化，因为编译器需要通过初始化表达式来推断变量的类型。</p>
        <p>总之，var关键字是Java中一种方便的局部变量类型推断机制，它可以使代码更简洁和易读，但需要注意其使用范围和初始化要求。</p>`

	title:"Java中的子类与父类（继承）",
	language:"java",
	fullContent:
		`<p>子类与父类（继承）是面向对象编程中的一个重要概念。通过继承，子类可以获取父类的属性和方法，从而实现代码的重用和扩展。</p>
		<p>在Java中，使用extends关键字来实现继承。例如：</p>
		<p><pre><code class = 'language-java'>
class Animal
{
    private int num;
    public String name;

    protected void speak()
    {
        System.out.println("Hello");
    }
}

class Dogs extends Animal
{
    protected void speak()//重写父类中的speak方法
    {
        System.out.println("Hi");
    }
}

public class ZiLeiYuFuLei
{
    public static void main(String args[])
    {
        Animal dogs = new Dogs();//父类 对象名 = new 子类，反过来报错
        dogs.name = "dog";
        dogs.speak();
    }
}
		</code></pre></p>
		<p>在这个例子中，我们定义了一个名为Animal的父类，其中包含一个名为name的属性和一个名为speak()的方法。然后我们定义了一个名为Dog的子类，它继承了Animal类，并重写了一个名为speak()的新方法。</p>
		<p>需要注意的是，子类可以访问父类的所有public和protected成员，但不能访问父类的private成员。此外，子类还可以重写父类的方法，以提供特定于子类的实现。</p>
		<p>继承是Java中一种重要的特性，它允许我们在已有的基础上创建新的类，从而实现代码的重用和扩展。</p>
		<p>instanceof运算符在这里会有所变动。它左边是对象，右边是类名，但是这个对象必须是右边的类或子类创建的对象时，返回true，否则返回false。</p>
		<p>成员变量的隐藏：变量是在子类中重新声明的，会隐藏父类中的同名变量。使用变量会由类型决定。</p>`

		title:"Java中的super关键字",
		language:"java",
        fullContent:
		`<p>super关键字是Java中用于访问父类成员的一种机制。它主要用于在子类中调用父类的构造方法、属性和方法。</p>
		<p>在Java中，使用super关键字可以实现对父类成员的访问。例如：</p>
		<p><pre><code class = 'language-java'>
class Animal1
{
    String name;

     void speek()
    {
        System.out.println("hehe");
    }
}

class Dogs1 extends Animal1
{
    void speek()
    {
        super.speek();//调用父类的speek方法输出hehe
        System.out.println("haha");//输出haha
    }

}

public class Super
{
    public static void main(String args[])
    {
        Animal1 animal1 = new Dogs1();
        animal1.speek();//调用speek方法(Dogs1()的对象所以是子类)
    }
}
		</code></pre></p>
		<p>在这个例子中，我们定义了一个名为Animal的父类，其中包含一个名为name的属性和一个名为speak()的方法。然后我们定义了一个名为Dog的子类，它继承了Animal类，并重写了一个名为speak()的新方法。在Dog类中，我们使用super关键字调用了父类的speak()方法。</p>
		<p>需要注意的是，super关键字只能在子类中使用，并且只能在第一行使用，所以使用时要考虑this()等其他需要在第一行使用的关键字；还不能出现循环调用的情况(A调用B，B调用A)。</p>`

		date:"2026年3月26日",
		category:"Java",
		title:"Java中的final关键字",
		language:"java",       
        fullContent:
		`<p>final关键字是Java中用于修饰类、方法和变量的一种机制，它表示被修饰的元素不能被修改或继承。使用final关键字可以提高代码的安全性和稳定性，防止意外的修改和继承。</p>
		<p>以下是final关键字的详细说明：</p>
		<p><ul style='padding-left:1em'>
			<li><strong>final类</strong>: 使用final修饰的类不能被继承。这意味着其他类无法扩展这个类，也无法创建它的子类。例如：<code>public final class MyClass { ... }</code></li>
			<li><strong>final方法</strong>: 使用final修饰的方法不能被重写。这意味着子类无法提供这个方法的新实现。例如：<code>public final void myMethod() { ... }</code></li>
			<li><strong>final变量</strong>: 使用final修饰的变量是常量，一旦被赋值后就不能再修改。这适用于基本类型和引用类型。例如：<code>public final int MY_CONSTANT = 10;</code></li>
		</ul></p>
		<p>例如：</p>
		<p><pre><code class = 'language-java'>
public class Final
{
    public static final String COMPANY = "Java.Inc";//static final静态常量
    private final int id;//实例常量
    private final String name;//实例常量

    public Final(int id,String name)//final方法
    {
        this.id = id;
        this.name = name;
    }

    public final void display()//普通方法
    {
        System.out.println("ID: " + id + ", Name: " + name);
    }

    public void show()
    {
        final int localNum = 99;//局部常量
        System.out.println(localNum);
    }

    public static void main(String args[])
    {
        Final ccc = new Final(1,"zhangsan");
        ccc.display();
        ccc.show();

        System.out.println(COMPANY);//可以省略类名，因为在同一个类
        System.out.println(Final.COMPANY);//不同类中必须要带上类名
    }
}
		</code></pre></p>
		<p>final关键字是Java中用于修饰类、方法和变量的重要工具，通过使用它们，我们可以提高代码的安全性和稳定性，防止意外的修改和继承。</p>`

        fullContent:
		`<p>上转型和下转型是Java中关于继承和多态的重要概念。上转型是指将子类对象赋值给父类引用，而下转型是指将父类引用强制转换为子类类型。</p>
		<p>上转型示例：</p>
		<p><pre><code class = 'language-java'>
class Animal2
{
    String name = "Animal";

    public void Eat()
    {
        System.out.println("These animals are eating food");
    }
}

class Dog2 extends Animal2
{
    String name = "Dog";
    String breed = "Golden Retriever";

    public void Eat()
    {
        System.out.println("The dog is eating bones");
    }

    public void bark()
    {
        System.out.println("Wolf");
    }
}

public class ShangZhuanXing
{
    public static void main(String args[])
    {
        Animal2 animal2 = new Dog2();
        animal2.Eat();//使用子类重写的方法
        System.out.println(animal2.name);//父类的属性
    }
}
		</code></pre></p>
		<p>在这个例子中，我们创建了一个Dog对象，并将其赋值给Animal类型的引用。这就是上转型，它允许我们使用父类的引用操作子类对象。</p>
		<p>下转型示例：</p>
		<p><pre><code class = 'language-java'>
class Animal3
{
    public void eat()
    {
        System.out.println("eat");
    }
}

class Dog3 extends Animal3
{
    public void eat()
    {
        System.out.println("Dog eat");
    }

    public void bark()
    {
        System.out.println("bark");
    }
}

public class XiaZhuanXing
{
    public static void main(String args[])
    {
        Animal3 animal3 = new Dog3();
        animal3.eat();//上转型

        Dog3 dog3 = (Dog3)animal3;//下转型
        dog3.bark();//子类特有的方法
    }
}
		</code></pre></p>
		<p>在这个例子中，我们首先将Dog对象赋值给Animal类型的引用，然后又将其强制转换为Dog类型。这就是下转型，它允许我们访问子类特有的方法和属性。</p>
		<p>需要注意的是，下转型必须是安全的，即父类引用实际上指向的是子类对象。否则会抛出ClassCastException异常。</p>
		<p>总的来说:</p>
		<p>上转型是父类的对象能调用子类的重写的方法，访问的属性由父类决定，子类特有的属性和方法不能使用。就是能用父类的属性和子类中对父类重写的方法。访问的属性由父类决定，子类特有的属性和方法不能使用。</p>
		<p>下转型是对父类定义的对象的强制类型转换成子类，再赋给子类创建的对象，就是下转型图中的<code>Dog3 dog3 = (Dog3)animal3</code>，可以调用子类所有的方法，属性，包括特有的方法，属性。<u>注意：默认访问的是子类的属性，如果要访问父类的属性，需要使用super关键字。</u></p>`

		<p>使用abstract关键字的语法如下：</p>
		<p><code>public abstract class MyClass { ... }</code></p>
		<p><code>public abstract void myMethod();</code></p>
		<p>例如：</p>
		<p><pre><code class = 'language-java'>
abstract class Animal

}

{

    }
}

		</code></pre></p>

		<p>abstract类和abstract方法是Java中用于定义抽象概念的重要工具，它们使得我们可以定义一些通用的行为规范，并在具体的子类中提供实现。</p>`

        title:"Java中的接口（interface）",
        language:"java",
        fullContent:
        `<p>接口（interface）是Java中用于定义一组抽象方法,接口的关键字是interface。接口的定义和类的定义很相似，分为接口声明和接口体。</p>
        <p>接口声明：<code>interface Com{...}</code>,就是interface 接口名字</p>
        <p>接口体：<code>public static final int CONSTANT = 10;</code></p>
        <p>接口中的方法默认是public abstract的，属性默认是public static final的。</p>
        <p><pre><code class = 'language-java'>
interface Com
{
    public static final int MAX = 100;
    //等价 int MAX = 100,默认属性是public static final的
    public abstract void add();
    //等价 void add(),默认方法是public abstract,有参数也是一样的
    public abstract float sum(float x,float y);
    //等价于 float sum(float x,float y)
}
        </code></pre></p>
        <p><s>这是伪代码，完整的代码举例在下一篇哦~</s></p>
        <p>接口的default实例方法:</p>
        <p><pre><code class = 'language-java'>
interface ComDefault
{
    public final int Max = 100;
    public abstract void add();
    public abstract float sum(float x,float y);

    public default int max(int a,int b)
    {
        return a > b?a : b;//三元操作符，意思是：判断a是否大于b,如果大于返回,否则返回b
    }
}
        </code></pre></p>
        <p>这里面的default关键字不能省略，因为不允许定义通常的带方法体的public实例方法。default实例方法访问权限必须是public（允许省略public修饰符）</p>
        <p>接口体中的static方法：</p>
        <p><pre><code class = 'language-java'>
interface ComStatic
{
    public final int Max = 100;
    public abstract void add();
    public abstract float sum(float x,float y);

    public default int max(int a,int b)
    {
        return a > b?a : b;
    }
    //从JDK 8 开始，允许在接口体中定义static方法。
    public static void f()
    {
        System.out.println("CCC");
    }
}
        </code></pre></p><p>可以直接在接口体中定义static方法。</p><p>还有private方法。</p><p>从JDK 9开始，允许在接口中定义peivate方法，目的是配合接口体中的default方法。即接口可以将某些算法封装在private的方法中，供接口中的default方法调用，实现算法的复用。</p>`
    },

        title:"Java中的实现接口",
        language:"java",
        fullContent:
        `<p>实现接口是指一个类通过使用implements关键字来实现一个或多个接口，从而提供接口中定义的抽象方法的具体实现。通过实现接口，类可以获得接口所定义的行为规范，并且可以被视为接口类型的对象。</p>
        <p>使用implements关键字的语法如下：</p><p><code>public class MyClass implements MyInterface { ... }</code></p>
        <p><code>class A implements Com,Addable</code></p>
        <p><code>class Dog extends Animal implements Eatable,Sleepable</code></p>
        <p>例如：</p>
        <p>实现接口允许我们定义类与接口之间的关系，类可以获得接口所定义的行为规范，并且可以被视为接口类型的对象。</p>
        <p><pre><code class = 'language-java'>
package Interface;

public interface Com
{
    public static final int Max = 100;
    public abstract void add();
    public abstract float sum(float x,float y);

    default int max(int a,int b)
    {
        outPut();
        return a > b?a : b;
    }

    public static void f()
    {
        System.out.println("f");
    }
    private void outPut()
    {
        System.out.println("output");
    }
}
            </code></pre></p>
            <p><pre><code class = 'language-java'>
package Interface;

public class AAA implements Com
{
    public void on()
    {
        System.out.println("on");
    }

    public float sum(float x,float y)
    {
        return x + y;
    }

    public void add()//尽管不用，但是这是抽象类，所以必须要由实现类实现
    {
        System.out.println("add");
    }
}
        </code></pre></p>
        <p><pre><code class = 'language-java'>
package Interface;

public class Test
{
    public static void main(String args[])
    {
        AAA a = new AAA();
        System.out.println(AAA.Max);
        System.out.println("调用on（重写）");
        a.on();
        System.out.println("调用sum（重写）" + a.sum(12,18));
        System.out.println("调用接口提供的default方法" + a.max(12,78));
        Com.f();
    }
}
        </code></pre></p>
        <p>在这个例子中，我们定义了一个名为Com的接口，其中包含了一个常量Max、两个抽象方法add()和sum()，以及一个default方法max()和一个static方法f()。然后我们定义了一个名为AAA的类，它实现了Com接口，并提供了add()和sum()方法的具体实现。在Test类中，我们创建了AAA对象，并调用了接口中的常量、重写的方法、default方法和static方法。</p>
        <p>接口的细节说明</p>
        <p>在定义接口时，如果关键字interface前面加上了public修饰符，那么该接口中的所有方法和常量都默认具有public访问权限，称这样的接口为public接口。public接口可以被任何一个类实现。</p>
        <p>如果一个接口不加public修饰，就称作友好接口，友好接口可以被与该接口在同一包中的类实现。</p>
    `},

        title:"Java中的接口回调",
        language:"java",
        fullContent:
        `<p>接口回调是Java中一种重要的编程模式，它允许一个类通过实现接口来定义一组方法，然后将这些方法的实现交给另一个类来完成。这种模式在事件处理、观察者模式等场景中非常有用。</p>
        <p>接口属于引用型变量，在接口变量中可以存放实现该接口的类的实例的引用，即存放对象的引用。</p>
        <p>例如：假设Com是一个接口，那么就可以用Com声明一个变量：</p>
        <p><code> Com com;</code></p>
        <p>声明了接口型变量Com，Com是一个接口，com是null，它只是一个“引用变量”，可以指向任何实现了Com接口的对象。</p>
        <p><code>ImpleCom object = new ImpleCom();</code></p>
        <p>创建了一个ImpleCom类的实例对象,ImpleCom是实现了Com接口的类,object是这个对象的引用。</p>
        <p><code>com = object;</code></p>
        <p>关键一步：把object赋值给com,因为ImpleCom实现了Com接口，所以ImpleCom的对象可以赋值给Com类型的变量,这就是向上转型（upcasting）：把子类/实现类的引用赋给父类/接口类型的变量。</p>
        <p>举个例子：</p>
        <p><pre><code class = 'language-java'>
package Interface;

interface ShowMessage
{
    void DisplayTrademark(String s);
    default void outPutStart()
    {
        System.out.println("********");
    }
}

class TV implements ShowMessage
{
    public void DisplayTrademark(String s)
    {
        System.out.println("tvtvtvtv");
        System.out.println(s);
        System.out.println("tvtvtvtv");
    }
}

class PC implements ShowMessage
{
    public void DisplayTrademark(String s)
    {
        System.out.println("pcpcpcpc");
        System.out.println(s);
        System.out.println("pcpcpcpc");
    }
}

public class InterfaceBack
{
    public static void main(String args[])
    {
        ShowMessage sm;
        sm = new TV();
        sm.DisplayTrademark("长城牌电视机");
        sm = new PC();
        sm.outPutStart();
        sm.DisplayTrademark("华为电脑");
        sm.outPutStart();
    }
}
        </code></pre></p>
        <p>在这个例子中，我们定义了一个名为ShowMessage的接口，其中包含了一个抽象方法DisplayTrademark()和一个default方法outPutStart()。然后我们定义了两个类TV和PC，它们都实现了ShowMessage接口，并提供了DisplayTrademark()方法的具体实现。在InterfaceBack类中，我们创建了一个ShowMessage类型的变量sm，并将其赋值为TV和PC的实例对象，分别调用了DisplayTrademark()方法和outPutStart()方法。</p>
        <p>接口回调是一种非常有用的编程模式，它允许我们在不同的类之间进行通信和协作，从而实现更灵活和可扩展的代码设计。</p>
    `},

        title:"Java中的函数接口和Lambda表达式",
        language:"java",
        fullContent:
        `<p>函数接口：如果一个接口中有且只有一个abstract方法，那么这个接口是单接口。从JDK 8 开始，Java使用Lambda表达式，并将但接口称为函数接口。</p>
        <p>Lambda表达式是一种简洁的语法，用于创建匿名内部类的实例。它简化了函数接口的使用，使得代码更加简洁和易读。</p>
        <p>下面是举例：</p>
        <p>这是普通函数：</p>
        <p><pre><code class = 'language-java'>
public class BiaoDaShi
{
    int computerSum(int a,int b)
    {
        return a + b;
    }
}
        </code></pre></p>
        <p>这是Lambda表达式：</p>
        <p><pre><code class = 'language-java'>
(int a,int b) ->
{
    return a + b;
}
        </code></pre></p>
        <p>或者</p>
        <p><pre><code class = 'language-java'>
(a,b) ->
{
    return a + b;
}
        </code></pre></p>
        <p>语法是这样的：<code>(参数) -> { 方法体 }</code></p>
        <p>Lambda表达式过于简化，所以必须要有上下文，编译器才能准确推断出表达式是哪个方法，才能计算出Lambda表达式的值，Lambda表达式的值就是方法的入口地址。</p>
        <p>具体例子：</p>
        <p><pre><code class = 'language-java'>
interface SingleCom
{
    abstract int computeSum(int a,int b);
}

public class BiaoDaShi
{
   public static void main(String args[])
   {
       SingleCom com = (a,b) ->
       {
           return a + b;
       };//把Lambda表达式的值赋值给接口变量com
       
       int result = com.computeSum(10,8);//com就能调用Lambda表达式中接口的方法
       
       System.out.println(result);
   }
}
        </code></pre></p>
        <p>本篇的Lambda表达式和和上一篇的接口回调是相关的。</p>
        <p><pre><code class = 'language-java'>
interface ShowMessage
{
    void DisplayTrademark(String s);
}

public class Test
{
    public static void main(String args[])
    {
        ShowMessage sm;
        sm = (s) ->
        {
          System.out.println("tvtvtvtv");
          System.out.println(s);
          System.out.println("tvtvtvtv");
        };
        sm.DisplayTrademark("长城牌电视机");//接口回调Lambda表达式实现的接口方法

        sm = (s) ->//接口变量中存放Lambda的值
        {
          System.out.println("pcpcpcpc");
          System.out.println(s);
          System.out.println("pcpcpcpc");
        };
        sm.DisplayTrademark("华为电脑");//接口回调Lambda表达式实现的接口方法
    }
}
        </code></pre></p>
        <p>这个例子和上一篇的例子是差不多的，可以类比学习。</p>
    `},

        fullContent:
        `<p>接口与多态：由接口产生的多态是指在不同类中实现同一接口时，表现出的不同行为。</p>
        <p>下面通过一个例子来说明：</p>
        <p><pre><code class = 'language-java'>
interface ComputerAverage
{
    public double average(double a,double b);
}

class A implements ComputerAverage
{
    public double average(double a,double b)
    {
        double aver = 0;
        aver = (a + b)/2;
        return aver;
    }
}

class B implements ComputerAverage
{
    public double average(double a,double b)
    {
        double aver = 0;
        aver = Math.sqrt(a * b);
        return aver;
    }
}

public class JieKouDuoTai
{
    public static void main(String args[])
    {

        computer = new B();
        result = computer.average(a,b);
        System.out.printf("%5.2f和%5.2f的几何平均值:%5.2f\\n",a,b,result);
    }
}
        </code></pre></p>
        <p>这个例子中，A,B类都实现了ComputerAverage接口，但它们的average方法有不同的实现，这就是多态的体现。</p>

        title:"Java中的接口参数",
        language:"java",
        fullContent:
        `<p>接口参数是接口中定义的方法的参数。接口参数的使用可以使得接口更加灵活和通用。</p>
        <p>下面通过一个例子来说明：</p>
        <p><pre><code class = 'language-java'>
interface SpeakHello
{
    void speakHello();
}

class Chinese implements SpeakHello
{
    public void speakHello()
    {
        System.out.println("你好");
    }
}

class English implements SpeakHello
{
    public void speakHello()
    {
        System.out.println("Hello");
    }
}

class KindHello
{
    public void lookHello(SpeakHello hello)//接口类型参数
    {
        hello.speakHello();//接口回调
    }
}

public class JieKouCanShu
{
    public static void main(String args[])
    {
        KindHello a = new KindHello();
        Chinese ccc = new Chinese();
        a.lookHello(ccc);
        a.lookHello(new English());
        a.lookHello(() -> {System.out.println("no bug");});
        //向参数传递Lambda的值
    }
}
        </code></pre></p>
        <p>在这个例子中，我们定义了一个名为SpeakHello的接口，其中包含了一个抽象方法speakHello()。然后我们定义了两个类Chinese和English，它们都实现了SpeakHello接口，并提供了speakHello()方法的具体实现。KindHello类中定义了一个lookHello()方法，它接受一个SpeakHello类型的参数，并调用该参数的speakHello()方法。在main方法中，我们创建了KindHello对象，并通过lookHello()方法传递了不同的SpeakHello实现对象，包括一个Lambda表达式。</p>

        title:"Java中的内部类",
        language:"java",
        fullContent:
        `<p>内部类是定义在另一个类内部的类。内部类可以访问外部类的成员，包括私有成员。内部类的使用可以提高代码的封装性和可读性。</p>
        <p>包装内部类的类称为内部类的外嵌类。</p>
        <p>内部类和外嵌类的重要关系：</p>
        <ul style ='padding-left:1em'>
            <li>内部类和外嵌类的成员变量在内部类中依然有效，内部类中的方法也可以调用外嵌类中的方法。</li>
            <li>外嵌类的类体中可以用内部类声明对象，作为外嵌类的成员。</li>
            <li>内部类仅供他的外嵌类使用，其他类不可以用某个类的内部生命对象。</li>
            <li>内部类的外嵌类的成员变量在内部类中依然有效，使得内部类和外嵌类的交互更加方便。</li>
        </ul>
        <p>举例：</p>
        <p><pre><code class = 'language-java'>
package Class;

public class RedCowFarm
{
    static  String farmName;
    RedCow cow;//内部类声明对象
    RedCowFarm()
    {

    }

    RedCowFarm(String s)
    {
        cow = new RedCow(150,112,5000);
        farmName = s;
    }

    public void showCowMess()
    {
        cow.speak();
    }

    class RedCow//内部类的声明
    {
        String cowName = "红牛";
        int height;
        int weight;
        int price;

        RedCow(int h,int w,int p)
        {
            height = h;
            weight = w;
            price = p;
        }

        void speak()
        {
            System.out.println("我是" + cowName + ",身高" + height + "cm体重" + weight + "kg价格" + price + "元，生活在" + farmName);
        }
    }//内部类结束
}//外嵌类结束
        </code></pre></p>
        <p><pre><code class = 'language-java'>
package Class;

public class Test
{
    public static void main(String args[])
    {
        RedCowFarm farm = new RedCowFarm("红牛农场");
        farm.showCowMess();
        farm.cow.speak();
    }
}
        </code></pre></p>
        <p>在这个例子中，我们定义了一个名为RedCowFarm的外嵌类，其中包含了一个名为RedCow的内部类。RedCow类定义了红牛的属性和方法，而RedCowFarm类则创建了RedCow对象，并通过showCowMess()方法调用了RedCow的speak()方法。在main方法中，我们创建了RedCowFarm对象，并调用了showCowMess()方法和直接访问了cow对象的speak()方法。</p>
        <p>内部类和外嵌类就像房子和房子里的房间一样，外嵌类是内部类的容器。</p>
    `},

        title:"Java中的匿名类",
        language:"java",
        fullContent:
        `<p>在创建子类对象时，除了使用父类的构造方法外还有类体，此类体被认为是一个子类去掉声明后的类体，称作匿名类。</p>
        <p>匿名类就是一个子类，由于无名可用，所以不可能用匿名类声明对象，但可以直接用匿名类创建一个对象。</p>
        <p>匿名类有如下特点：</p>
        <p><ol style= "list-style:none" >
            <li>(1) 匿名类可以继承父类的方法，也可以重写父类的方法。</li>
            <li>(2) 在使用匿名类的时候，必然是在某个类中直接用匿名类创建对象，因此匿名类一定是内部类。</li>
            <li>(3) 匿名类可以访问外嵌类中的成员变量和方法，在匿名类的类体中不可以声明static成员变量和static方法。</li>
            <li>(4) 由于匿名类是一个子类，且没有类名，所以在用匿名类创建对象的时候要直接使用父类的构造方法。</li>
            <li>(5) 匿名类不能定义构造方法（因为它没有类名，所以无法定义构造函数）</li>
        <p>下面举一个简单的例子：</p>
        <p><pre><code class = 'language-java'>
interface CanEat 
{
    void eat();
}

public class NiMingLei
{
    public static void main(String argss[])
    {
        CanEat canEat = new CanEat()
        {
            public void eat()
            {
                System.out.println("eat");
            }
        };
        canEat.eat();
    }
}
        </code></pre></p>
        <p>上面的例子中：<code>CanEat canEat = new CanEat(){...};</code>就是匿名类的表现。</p>
        <p>它重写了eat方法，在接口中，仅仅声明了此方法，匿名类可以实现eat方法。</p>
        <p>除了这种写法（和接口有关），还有和类有关的。</p>
        <p><pre><code class = 'language-java'>
package NiMingLei;

class Cat
{
    public void C()
    {

    }
}
public class WuJieKou
{
    public static void main(String args[])
    {
        Cat cat = new Cat()
        {
            public void C()
            {
                System.out.println("喵喵");
            }
        };
        cat.C();
    }
}
        </code></pre></p>
        <p>这个例子也是匿名类，这两个例子的区别就是第一个使用了接口，这个使用类。</p>
        <p>用lambda表达式也可以代替匿名类。</p>
        <p><pre><code class = 'language-java'>
package NiMingLei;

interface SpeakHello
{
    void speak();//定义了一个SpeakHellow接口，声明了speak方法
}

class HelloMachine
{
    public void turnOn(SpeakHello hello)//参数是SpeakHello（接口），变量名是hello
    {
        hello.speak();//定义了HelloMachine类，实现了一个turnOn方法
        //接口类型的hello调用接口中的speak方法
    }
}
public class Lambda
{
    public static void main(String args[])
    {
        HelloMachine machine = new HelloMachine();
        //machine调用turnOn方法，但turnOn只有一个实现，可以使用lambda表达式
        // 无参数，方法体就是输出语句，相当于speak的实现
        machine.turnOn(()->{System.out.println("Hello,you are welcome!");});
        machine.turnOn(()->{System.out.println("你好，欢迎光临!");});
    }
}
        <p>上面的例子使用了lambda表达式代替匿名类。</p>
    `},

        title:"Java中的异常类",
        language:"java",
        fullContent:
        `<p>异常类就是程序运行时可能出现的一些错误。比如：打开一个不存在的文件。</p>
        <p>Java使用throw关键字抛出一个Exception子类的实例表示异常发生。</p>
        <p>例如：java.lang包中的Integer类型调用其类方法public static int parseInt(String s)可以将“数字”格式的字符串转换为整数，但是当试图将字符串“ab89”转换为数字时：</p>
        <p><code>int numer = Integer.parseInt("ab89");</code></p>
        <p>方法parseInt()在执行过程中会抛出NumberFormatException对象（使用throw关键字抛出一个NumberFormatException对象）,即程序出现NumberFormatException异常。</p>
        <p>Java允许在定义方法时声明该方法调用过程中可能出现的异常。即允许方法在调用过程中抛出的异常对象，终止当前方法的执行。</p>
        <p>异常对象可以调用以下方法得到或输出有关异常的信息：</p>
        <p><ol style= "list-style:none" >
            <li><code>public String getMessage();</code></li>
            <li><code>public void printStackTrace();</code></li>
            <li><code>public String toString();</code></li>
        </ol></p>
    `},
    {
        id:"a33",
        date:"2026年5月12日",
        category:"Java",
        title:"Java中的try-catch语句",
        language:"java",
        fullContent:
        `<p>Java使用try-catch语句来处理异常，将可能出现的异常操作放在try-catch语句的try部分，一旦try部分抛出异常对象，或调用某个可能抛出异常对象的方法，并且该方法抛出了异常对象，那么try部分将立刻结束执行，转向执行相应的catch部分。</p>
        <p>try-catch语句可以由几个catch组成，分别处理发生的相应异常。</p>
        <p>基本语法格式：</p>
        <p><pre><code class = 'language-java'>
try
{
    ...//可能抛出异常的代码
}
catch(异常类型1 变量名1)
{
    ...//处理异常类型1的代码
}
catch(异常类型2 变量名2)
{
    ...//处理异常类型2的代码
}
catch(异常类型3 变量名3)
{
    ...//处理异常类型3的代码
}        
        </code></pre></p><p>
        下面是一个具体的例子：</p>
        <p><pre><code class = 'language-java'>
package YiChangLei;

import java.io.IOException;

public class YiChangLei1
{
    public static void main(String args[])
    {
        int n = 0;
        int m = 0;
        int t = 1000;
        try
        {
            m = Integer.parseInt("8888");
            n = Integer.parseInt("ab89");
            t = 7777;
        }
        catch (NumberFormatException e)
        {
            System.out.println("发生异常" + e.getMessage());
        }
        System.out.println("n:" + n +",m:" + m + ",t:" + t);
        try
        {
            System.out.println("故意抛出I/O异常");
            throw new java.io.IOException("故意的");

        }
        catch(IOException e)
        {
            System.out.println("有异常：" + e.getMessage());
        }
    }
}
        </code></pre></p>
        <p>在这个例子中，我们尝试将字符串“ab89”转换为整数，这会抛出NumberFormatException异常，我们在catch块中捕获并处理了这个异常。然后我们故意抛出了一个IOException异常，并在另一个catch块中捕获并处理了这个异常。</p>
        <p>在第一个try块中，m = 8888 执行成功，m=8888；n有异常，n = 0；而t被跳过了，所以t = 1000。（try捕捉到第一个异常就会停止执行，后面的语句不会执行，类似for循环的break语句。）</p>
        <p>try捕捉到异常后转到catch块,进行异常处理，最后执行输出语句。</p>
        <p>第二个try块中，第一条输出语句执行，输出内容，第二条是故意抛出的异常IOException，捕捉到后跳过后面的语句直接转到catch块进行处理。本catch块中处理方式是输出"有异常"，然后把异常情况输出到控制台。</p>
        <p>所以本程序的输出结果就是那样的。</p>
        <p>e.getMessage()语句会输出具体的异常信息。比如上面代码中的<code> System.out.println("发生异常" + e.getMessage());</code>,会输出：<code>发生异常 For input string: "ab89"</code></p>
        <p>这就是try-catch语句的使用方法。</p>
        <p>需要注意的是：子类异常必须在父类异常之前，否则无法捕获到子类异常。</p>
        <p>在try-catch中还有finally块，用于执行无论是否发生异常都需要进行的清理工作。</p>
        <p>需要注意以下两种情况：</p>
        <p>(1) 如果在try-catch语句中使用了return语句，finally块中的代码仍然会执行。</p>
        <p>(2) 如果在try-catch语句中使用了System.exit(0)方法，finally块中的代码将不会执行，包括它之后的所有语句。</p>
        <p>例如：</p>
        <p><pre><code class = 'language-java'>
public class FinallyDemo
{
    public static void main(String[] args)
    {
        System.out.println("=== 测试1：return ===");
        System.out.println("返回值：" + testReturn());
        
        System.out.println("\\n=== 测试2：System.exit ===");
        testExit();
        System.out.println("这行不会输出");
    }
    
    public static int testReturn()
    {
        try
        {
            System.out.println("try 块");
            return 100;
        }
        finally
        {
            System.out.println("finally 块 - 我执行了！");
        }
    }
    
    public static void testExit()
    {
        try
        {
            System.out.println("try 块");
            System.exit(0);  // 程序直接退出
        }
            finally
        {
            System.out.println("finally 块 - 我不会执行");
        }
    }
}
        </code></pre></p>
        <p>在这个例子中，testReturn()方法中的finally块会执行，即使try块中有return语句。而testExit()方法中的finally块不会执行，因为System.exit(0)会直接终止程序的运行。</p>
    `},
    {
        id:"a34",
        date:"2026年5月13日",
        category:"Java",
        title:"Java中的自定义异常类",
        language:"java",
        fullContent:
        `<p>在编写程序时可以扩展Exception类来创建自定义异常类，然后根据程序的需要来规定哪些方法产生这样的异常。一个方法在声明时可以使用throws关键字声明要产生的若干异常，并在该方法的方法体中具体给出产生异常的操作，即用相应的异常类创建对象，并使用throw关键字抛出异常对象，导致该方法结束执行。</p>
        <p>程序必须在try-catch语句中调用可能发生异常的方法，其中catch的作用是捕获throw关键字抛出的异常对象。</p>
        <p>这里要介绍一下throw关键字和throws关键字的区别：</p>
        <p><u>throws</u>关键字用于方法声明中，表示该方法可能抛出的异常类型。</p>
        <p><u>throw</u>关键字用于方法体中，用于主动抛出一个异常对象。</p>
        <p>下面是一个自定义异常类的例子：</p>
        <p><pre><code class = 'language-java'>
package YiChangLei;

public class BankException extends Exception
{
    //BankException继承了Exception
    String message;
    public BankException(int m,int n)
    {
        message = "入账资金" + m + "是负数或支出" + n + "是正数，不符合系统要求。";
    }
    public String warnMess()
    {
        return message;
    }
}
        </code></pre></p>
        <p><pre><code class = 'language-java'>
package YiChangLei;

public class Bank
{
    private int money;
    public void income(int in,int out) throws BankException
    {
        if(in <= 0 || out >= 0 || in + out <= 0)
        {//如果入账资金in是负数，或支出out是正数，或入账资金和支出之和是负数或零，那么就抛出BankException异常对象
            throw new BankException(in,out);//方法抛出异常，导致方法结束
        }
        int netIncome = in + out;//计算纯收入
        System.out.printf("本次计算出的纯收入是：%d\\n元" ,netIncome);
        money = money + netIncome;//更新银行的资金
    }
    public int getMoney()
    {
        return money;
    }
}
        </code></pre></p>
        <p><pre><code class = 'language-java'>
package YiChangLei;

public class Test
{
    public static void main(String[] args)
    {
        Bank bank = new Bank();
        try
        {
            bank.income(200,-100);
            bank.income(300,-100);
            bank.income(400,-100);
            System.out.printf("银行目前有%d元\\n",bank.getMoney());
            bank.income(200,100);//支出是正数，不符合系统要求，抛出异常对象
            bank.income(99999,-100);//不会执行，因为上面一行抛出异常对象后，try块就结束了，后面的语句不会执行
        }
        catch(BankException e)
        {
            System.out.println("计算收益的过程出现如下问题：");
            System.out.println(e.warnMess());//调用异常对象的warnMess()方法输出异常信息
        }
        System.out.printf("银行目前有%d元\\n",bank.getMoney());
    }
}
        </code></pre></p>
        <p>输出结果是：</p>
        <p>本次计算出的纯收入是：100元</p>
        <p>本次计算出的纯收入是：200元</p>
        <p>本次计算出的纯收入是：300元</p>
        <p>银行目前有600元</p>
        <p>计算收益的过程出现如下问题：</p>
        <p>入账资金200是负数或支出100是正数，不符合系统要求。</p>
        <p>银行目前有600元</p>
        <p>在这个例子中，我们定义了一个名为BankException的自定义异常类，它继承了Exception类，并包含了一个构造方法和一个warnMess()方法。然后我们定义了一个名为Bank的类，其中包含了一个income()方法，该方法使用throws关键字声明可能抛出的BankException异常，并在方法体中使用throw关键字抛出异常对象。最后，在Test类中，我们创建了Bank对象，并在try-catch块中调用了income()方法，捕获并处理了可能抛出的BankException异常。</p>
        <p>主方法中，bank调用三次正确的income()方法，将数据传入，并输出此时银行的的金额。第四次调用时，传入的参数不对，出现了异常，第五次调用被跳过，直接转入catch。</p>
        <p>此时，输出了四行结果。</p>
        <p>进入catch后，输出异常信息，并输出e.warnMess()的返回值message。此时的m = 200, n = 100,所以输出：入账资金200是负数或支出100是正数，不符合系统要求。</p>
        <p>catch执行完后执行后续代码，于是输出：银行目前有600元。</p>
        <p>这就是本程序的执行过程。</p>
    `},

        id:"a35",
        date:"2026年5月14日",
        category:"Java",
        title:"Java中的assert语句",
        language:"java",
        fullContent:
        `<p>断言语句在调试代码阶段非常有用，它可以用来在开发和测试阶段检查程序的假设条件是否成立。</p>
        <p>java的断言和c语言的断言概念类似，但是由一点区别。</p>
        <p><table style="width: 100%; border-collapse: collapse; margin: 1rem 0; background: #0a0e16; border-radius: 16px; overflow: hidden;">
        <thead>
            <tr style="background: #2a3a4a;">
                <th style="padding: 12px 16px; text-align: left; color: #ffd7a0; border-bottom: 2px solid #ffcd94;">对比项</th>
                <th style="padding: 12px 16px; text-align: left; color: #ffd7a0; border-bottom: 2px solid #ffcd94;">Java</th>
                <th style="padding: 12px 16px; text-align: left; color: #ffd7a0; border-bottom: 2px solid #ffcd94;">C语言</th>
            </tr>
        </thead>
        <tbody>
            <tr style="border-bottom: 1px solid #2a3a4a;">
                <td style="padding: 12px 16px; color: #e6e2db;">默认启用状态</td>
                <td style="padding: 12px 16px;color: #e6e2db;">禁用（需要手动开启）</td>
                <td style="padding: 12px 16px; color: #e6e2db;">启用（无需设置）</td>
            </tr>
            <tr>
                <td style="padding: 12px 16px; color: #e6e2db;">开启方式</td>
                <td style="padding: 12px 16px;color: #e6e2db;">java -ea MyClass</td>
                <td style="padding: 12px 16px; color: #e6e2db;">无需开启，直接编译运行</td>
            </tr>
            <tr>
                <td style="padding: 12px 16px; color: #e6e2db;">错误类型</td>
                <td style="padding: 12px 16px;color: #e6e2db;">AssertionError（继承 Error）</td>
                <td style="padding: 12px 16px; color: #e6e2db;">调用 abort() 终止程序</td>
            </tr>
            <tr>
                <td style="padding: 12px 16px; color: #e6e2db;">自定义消息</td>
                <td style="padding: 12px 16px;color: #e6e2db;">可以添加（冒号后）</td>
                <td style="padding: 12px 16px; color: #e6e2db;">不支持（只能输出表达式）</td>
            </tr>
            <tr>
                <td style="padding: 12px 16px; color: #e6e2db;">正式环境</td>
                <td style="padding: 12px 16px;color: #e6e2db;">生产环境通常禁用</td>
                <td style="padding: 12px 16px; color: #e6e2db;">可以保留</td>
            </tr>
            <tr>
                <td style="padding: 12px 16px; color: #e6e2db;">引入版本</td>
                <td style="padding: 12px 16px;color: #e6e2db;">Java 1.4（2002年）</td>
                <td style="padding: 12px 16px; color: #e6e2db;">C99 标准化，但早期就有</td>
            </tr>
        </tbody>
        </table></p>
        <p>以上就是Java断言语句和C语言断言的对比。</p>
        <p>断言语句的语法格式：</p>
        <p><code>assert booleanException;</code></p>
        <p><code>assert booleanException:messageExpection;</code></p>
        <p>例如，对于：<code>assert number > 0;</code>, 如果 number <= 0，将会抛出 AssertionError 异常，程序立刻结束执行。如果number > 0,程序继续执行。</p>
        <p>如果使用：<code>assert booleanException;</code>，那么当断言失败时，会抛出 AssertionError 异常，程序会从断言处停止执行。</p>
        <p>如果使用：<code>assert booleanException:messageException;</code>，那么当断言失败时，会抛出 AssertionError 异常，并附带指定的错误消息（messageException表达式的值）。</p>
        <p>assert示例：</p>
        <p><pre><code class = 'language-java'>
package Assert;

public class C
{
    public  static void main(String[] args)
    {
        int score[] = {-120,98,89,120,99};
        int sum = 0;
        for(int number:score)
        {
            assert number >= 0:"负数不能是成绩";
            sum = sum + number;
        }
        System.out.println("总成绩" + sum);
    }
}
        </code></pre></p>
        <p>在这个例子中，我们定义了一个包含成绩的数组score，其中有一个负数-120。我们使用assert语句来检查每个成绩是否为非负数，如果遇到负数，断言将失败，抛出AssertionError异常，并输出消息“负数不能是成绩”。如果所有成绩都为非负数，程序将继续执行并计算总成绩。</p>
        <p>注意：断言语句在生产环境中通常被禁用，以避免影响程序的性能和稳定性。在调试程序的时候可以使用-ea选项启用断言。</p>
        <p>而且：断言捕获到的异常是 Error 类型，不需要用 try-catch 捕获。</p>
    `},
    {
        id:"a40",
        date:"2026年4月6日",
        category:"数据结构",
        title:"数据结构的概述",
        language:"c",
        fullContent:
        `<p>1. 什么是数据结构？</p>
        <p>数据结构是计算机科学中的一个重要概念，它指的是在计算机中组织和存储数据的方式。数据结构的设计和选择对于算法的效率和性能有着直接的影响。常见的数据结构包括数组、链表、栈、队列、树、图等。</p>
        <p>数据是信息的载体，能够被计算机识别、存储和加工处理。数据包括文字、表格、图像等。</p>
        <p>数据的基本单位是<u>数据元素（Data Element）</u>。通常把数据元素作为一个整体进行处理。</p>
        <p><u>数据对象</u>是具有相同类型的数据元素的集合。</p>
        <p><u>数据项</u>是数据元素中具有独立意义的最小标识单位。</p>
        <p><u>数据结构</u>是数据元素相互关系之间存在一种或多种特定关系数据元素的集合。</p>
        <p>归纳起来，数据结构一般包括一下三方面的内容：</p>
        <p><ul style ='padding-left:1em'>
            <li>数据逻辑结构</li>
            <li>数据存储结构</li>
            <li>数据运算</li>
        </ul></p>
        <p>数据运算的定义是基于逻辑结构的，实现是基于存储结构的。</p>
        <p>&nbsp;</p>
        <p>2. 数据的逻辑结构</p>
        <p>数据元素之间的逻辑关系整体称为数据的逻辑结构。</p>
        <p>数据元素在计算机中的存储方式称为数据的存储结构。</p>
        <p>根据元素之间的逻辑关系的不同特性，分为下列4种类型：</p>
        <p><ul style ='padding-left:1em'>
            <li><u>集合</u>:包含的所有元素同属于一个集合（数据元素之间没有关系，集合是最一种松散的逻辑结构）。</li>
            <li><u>线性结构</u>:数据元素之间存在一对一的关系。</li>
            <li><u>树形结构</u>:数据元素之间存在一对多的关系。</li>
            <li><u>图形结构</u>:数据元素之间存在多对多的关系。</li>
        </ul></p>
        <p>数据的逻辑结构可以采用多种方式描述，<u>二元组</u>是一种既常用也十分通用的数据逻辑结构表示方式。</p>
        <p>每个关系用偶序集合表示，一个偶序表示两个元素之间的相邻关系，用尖括号表示有向关系：<a,b>表示 a->b,;圆括号表示无向关系：(a,b)表示 a-b。</p>
        <p>&nbsp;</p>
        <p>3. 数据的存储结构</p>
        <p>数据逻辑结构在计算机存储器中的表示称为数据的<u>存储结构(存储表示)</u>,也称为数据的物理结构。</p>
        <p>(1)顺序的存储结构：</p>
        <p>顺序的存储结构是采用一组连续的存储单元来存放所有的数据元素，而且逻辑上相邻的元素的存储单元也相邻。</p>
        <p>主要优点是节省存储空间，可实现队数据的随机存取。</p>
        <p>主要缺点是不便于修改，在对元素进行插入或删除操作时可能需要移动大量元素。</p>
        <p>(2)链式存储结构：</p>
        <p>链式存储结构是采用一组任意的存储单元来存放所有的数据元素，这些存储单元可以是连续的，也可以是不连续的。</p>
        <p>每个结点单独储存，无须占用一整块存储空间，但为了表示结点之间的关系，需要在每个结点附加指针字段，用于存放相邻结点的存储地址。</p>
        <p>主要优点是便于修改，在进行插入和删除操作时，不需要移动大量元素。</p>
        <p>主要缺点是存储空间的利用率较低。，分配给每个结点的存储单元有一部分被用来存放结点之间的关系了，也没有随机存取。</p>
        <p>(3)索引存储结构：</p>
        <p>索引存储结构是通过建立索引来提高数据检索效率的一种存储方式。它将数据元素的键值和其在存储器中的位置建立映射关系，从而加快数据的查找速度。</p>
        <p>优点是检索速度快，查找效率高。缺点是需要额外的存储空间来存放索引，增加了时间和空间的开销。</p>
        <p>(4)哈希（散列）存储结构：</p>
        <p>哈希存储结构是通过哈希函数将数据元素的键值映射到存储位置的一种存储方式。也就是根据元素的关键字快速定位到数据的存储位置，从而实现快速的数据查找和插入操作。</p>
        <p>优点是查找和插入操作的时间复杂度较低，缺点是可能会出现哈希冲突，需要额外的处理机制（只存储数据本身，不存储元素之间的逻辑关系）。</p>
        <p>&nbsp;</p>
        <p>4. 数据运算</p>
        <p>包括运算定义和运算实现两部分。前者描述运算的功能，比较抽象;后者是在存储结构上设计对应运算的实现算法，是具体的。</p>
        <p>&nbsp;</p>
        <p>5. 算法及其描述</p>
        <p>算法的特性：</p>
        <p><u>算法</u>是对特定问题求解步骤的一种描述，他是指令的有限序列，其中每条指令表示一个或多个操作。</p>
        <p>算法的设计应满足一下几个目标：</p>
        <p><ul style ='padding-left:1em'>
            <li>正确性：算法必须能够正确地解决问题，得到预期的结果。</li>
            <li>高效率与低存储量：算法应该在合理的时间内完成任务，尽量减少资源的消耗。</li>
            <li>可读性：算法应该易于理解和维护，代码清晰、结构合理。</li>
            <li>健壮性：算法应该能够处理各种输入情况，包括边界条件和异常情况。</li>
            <li>可使用性（用户友好性）：算法应该易于实现和应用，具有良好的可扩展性。</li>
        </ul></p>
        <p>算法的五大特性：</p>
        <p><ul style ='padding-left:1em'>
            <li>输入：算法有零个或多个输入，这些输入是算法在运行时需要处理的数据。</li>
            <li>输出：算法有一个或多个输出，这些输出是算法处理输入后产生的结果。</li>
            <li>确定性：算法的每一步操作都是明确的，没有歧义，确保在相同的输入下得到相同的输出。</li>
            <li>有限性（有穷性）：算法必须在有限的步骤内完成，不能无限循环。</li>
            <li>可行性：算法中的每一步操作都必须是可行的，能够在有限的时间内完成。</li>
        </ul></p>
        <p>&nbsp;</p>
        <p>6.算法分析</p>
        <p>计算机资源主要包括计算时间和内存空间。</p>
        <p>算法的时间复杂度和空间复杂度是衡量算法性能的重要指标。</p>
        <p>衡量算法的好坏的四个标准：</p>
        <p><ul style ='padding-left:1em'>
            <li>算法的正确性：能对合法、非法、边界输入都得到正确结果。</li>
            <li>算法的可读性：算法应该易于理解和维护，代码清晰、结构合理。</li>
            <li>算法的时间复杂度：执行算法所需的时间与输入规模的关系。</li>
            <li>算法的空间复杂度：算法执行过程中所需的存储空间与输入规模的关系。</li>
        </ul></p>
        <p>算法的时间复杂度和空间复杂度在下一篇中详细介绍。</p>
    `},

        language:"c",
        fullContent:
        `<p>1. 时间复杂度和空间复杂度是衡量算法性能的两个重要指标。时间复杂度描述了算法执行时间随输入规模增长的变化趋势，而空间复杂度描述了算法所需存储空间随输入规模增长的变化趋势。</p>
        <p>时间复杂度通常用大O符号表示，例如O(1)、O(n)、O(n^2)等，表示算法的执行时间与输入规模n的关系。常见的时间复杂度有：</p>
        <ul style ='padding-left:1em'>
            <li>O(1)：常数时间复杂度，表示算法的执行时间不随输入规模的变化而变化。</li>
            <li>O(log n)：对数时间复杂度，表示算法的执行时间随着输入规模的增加而增加，但增长速度较慢。</li>
            <li>O(n)：线性时间复杂度，表示算法的执行时间与输入规模成正比关系。</li>
            <li>O(n log n)：线性对数时间复杂度，表示算法的执行时间随着输入规模的增加而增加，但增长速度比O(n)更快。</li>
            <li>O(n^2)：平方时间复杂度，表示算法的执行时间与输入规模的平方成正比关系。</li>
        </ul>
        <p>&nbsp;</p>
        <p>2. 空间复杂度通常也用大O符号表示，例如O(1)、O(n)等，表示算法所需存储空间与输入规模n的关系。常见的空间复杂度有：</p>
        <ul style ='padding-left:1em'>
            <li>O(1)：常数空间复杂度，表示算法所需存储空间不随输入规模的变化而变化。</li>
            <li>O(n)：线性空间复杂度，表示算法所需存储空间与输入规模成正比关系。</li>
            <li>O(n^2)：平方空间复杂度，表示算法所需存储空间与输入规模的平方成正比关系。</li>
        </ul>
        <p>在设计和分析算法时，了解时间复杂度和空间复杂度是非常重要的，可以帮助我们选择更高效的算法来解决问题。</p>
        <p>在实际应用中，对于时间复杂度和空间复杂度的计算需要根据具体的算法和数据结构进行分析。</p>
        <p>一般情况下，我们更关注时间复杂度，因为它直接影响算法的执行效率。</p>
        <p><u>计算时，一般以最坏情况下的时间复杂度为准。空间复杂度的计算也类似。</u></p>
